<script>
/* ================================================================================
   FED CHAIR — the game. Sections: boot helpers · screens · turn state · dial ·
   gauges and pipeline · ticker and advisors · END TURN sequence · events ·
   newspaper · history chart.

   The whole game is one loop: read the board, set one number, gavel the quarter.
   FedModel owns the economy; this file only draws it, and drives it one
   FedModel.step per END TURN so the lag the model builds in is the lag the player
   watches happen.
   ================================================================================ */
(function () {
  'use strict';
  if (typeof Arcade === 'undefined' || typeof ArcadeGraph === 'undefined' || typeof FedModel === 'undefined') return;

  var TURNS = 10;                                // ten quarters, whichever crisis
  var THUMB = 48;                                // the dial thumb's width, and the axis inset
  var BEAT = TIMING.beatSeconds * 1000;          // one step of the END TURN sequence; edit TIMING

  /** The crisis in play: its economics (FedModel.ERAS), its words (SCENARIOS), its rate band and
   *  its politics. showBriefing() points these at the crisis about to start; startRun() plays it. */
  var era = FedModel.ERAS['1975'];
  var S = SCENARIOS['1975'];
  var band = era.band;
  var P = FedModel.politicsFor('1975');
  /** The crisis the briefing on screen is for. @type {string} */
  var pendingEra = '1975';

  /* ===== BOOT HELPERS ===== */

  /** @param {string} id @returns {any} */
  function byId(id) { return document.getElementById(id); }
  /** @param {string} cls @param {string} [text] @returns {any} */
  function fill(cls, text) {
    var node = document.createElement('div');
    node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  /** @param {string} cls @param {string} [text] @returns {any} */
  function chip(cls, text) {
    var node = document.createElement('span');
    node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  /** @param {string} name a :root custom property @returns {string} */
  function token(name) {
    try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (err) { return ''; }
  }
  /** A real minus sign, so "−4.5 %" lines up in the mono column.
   *  @param {number} v @param {number} [places] @returns {string} */
  function num(v, places) {
    var s = Math.abs(v).toFixed(places === undefined ? 1 : places);
    return (v < 0 ? '−' : '') + s;
  }
  /** @param {number} t 1-based quarter @returns {{year:number, q:number}} */
  function quarterOf(t) { return { year: era.year + Math.floor((t - 1) / 4), q: ((t - 1) % 4) + 1 }; }
  /** @param {number} t @returns {string} e.g. "1976 Q2" */
  function quarterLabel(t) { var qq = quarterOf(t); return qq.year + ' Q' + qq.q; }

  var screens = {
    title: byId('screen-title'), era: byId('screen-era'), briefing: byId('screen-briefing'),
    howto: byId('screen-howto'), turn: byId('screen-turn'), news: byId('screen-news'),
    history: byId('screen-history')
  };
  var eraList = byId('eraList'), briefingText = byId('briefingText'), briefingTitle = byId('briefingTitle'), qeBtn = byId('qeBtn');
  var initialsBtn = byId('initialsBtn'), initialsPanel = byId('initialsPanel'), initialsMount = byId('initialsMount');
  var turnLabel = byId('turnLabel'), metersEl = byId('meters'), introEl = byId('intro');
  var gaugeStrip = byId('gaugeStrip'), realLine = byId('realLine'), pipelineEl = byId('pipeline'), tickerEl = byId('ticker');
  var hawkLine = byId('hawkLine'), doveLine = byId('doveLine');
  var rateOut = byId('rateOut'), deltaChip = byId('deltaChip');
  var dialEl = byId('dial'), dialWindow = byId('dialWindow'), dialThumb = byId('dialThumb');
  var nudgeDown = byId('nudgeDown'), nudgeUp = byId('nudgeUp'), endTurnBtn = byId('endTurn');
  var fomcMount = byId('fomcMount'), fomcStamp = byId('fomcStamp');
  var eventSheet = byId('eventSheet'), eventEmoji = byId('eventEmoji'), eventHead = byId('eventHead');
  var eventSub = byId('eventSub'), eventNote = byId('eventNote'), eventButtons = byId('eventButtons');
  var newspaperEl = byId('newspaper'), newsEnd = byId('newsEnd');
  var historyText = byId('historyText'), chartMount = byId('chartMount'), chartLegend = byId('chartLegend');
  var chartToggle = byId('chartToggle'), frqLine = byId('frqLine');
  var howtoCards = byId('howtoCards');

  /* ===== SCREENS ===== */

  /** Swap screens, deafen the page for a moment so a double tap cannot go two screens deep, and
   *  put the keyboard on the screen that just appeared instead of dropping it on <body>.
   *  @param {string} name a key of `screens` */
  /** True once the page is past its boot. Only an ?era= deep link makes the boot call show() at
   *  all — the title screen is already `active` in the markup — and arming the tap guard on that one
   *  call would make the deep link deaf for 350 ms after load. Every other load sets this at the end
   *  of boot, so the student's first tap on PLAY is guarded like any other screen change. */
  var booted = false;

  function show(name) {
    Object.keys(screens).forEach(function (key) { screens[key].classList.toggle('active', key === name); });
    window.scrollTo(0, 0);
    if (booted) Arcade.guardTaps();
    booted = true;
    Arcade.focusScreen(screens[name]);
  }

  /** Abandon whatever sequence or sheet is in flight and leave the board inert. */
  function abandonRun() {
    runToken += 1;
    skipSequence();
    closeSheet();
    fomcMount.hidden = true;      // a sequence cut off mid-gavel must not leave the stamp behind
    lockBoard(true);
    Arcade.voice.stop();
  }

  function goEra() {
    abandonRun();
    paintEras();
    show('era');
  }

  /* ===== TURN STATE ===== */

  /** The run in progress: the ten-quarter history it is building, the rate on the dial, and the
   *  two facts the ending needs — whether the White House call was taken, and the worst
   *  unemployment the run touched.
   *  @type {any} */
  var run = null;
  var runToken = 0;
  /** The END TURN sequence in flight, or null. `wakes` are the waiters a tap can cut short. */
  var sequence = null;
  /** @type {Record<string, any>} */ var gauges = {};

  // The deaf window a spent skip tap needs is the same one a screen change needs, so both games
  // now share Arcade's. Wrapping a handler in ignoringSkipTap is belt and braces: Arcade also
  // swallows the click itself, in the capture phase, for as long as the guard is up.
  var guarded = Arcade.guarded;
  var ignoringSkipTap = Arcade.ignoringSkipTap;

  /** @param {number} token @returns {boolean} false once the player has quit or replayed */
  function alive(token) { return token === runToken; }
  /** @returns {any} the state observed at the start of the current quarter */
  function current() { return run.history[run.t - 1]; }
  /** @returns {any} the meters as they stand at the start of the current quarter */
  function currentPol() { return run.politics[run.politics.length - 1]; }
  /** @returns {any} the meters a quarter ago, for the arrows on the row; null in quarter 1 */
  function previousPol() { return run.politics[run.politics.length - 2] || null; }
  /** @returns {any} the last state the run reached: the tenth quarter's, or the one the bill ended it on */
  function finalState() { return run.history[run.history.length - 1]; }
  /** @returns {number} quarters actually played */
  function quartersPlayed() { return run.history.length - 1; }

  /** @param {string} [eraId] the crisis to play; defaults to the one in play (Play again) */
  function startRun(eraId) {
    runToken += 1;
    var id = eraId || (run && run.era) || pendingEra;
    era = FedModel.ERAS[id];
    S = SCENARIOS[id];
    band = era.band;
    P = FedModel.politicsFor(id);
    buildGauges(S.GAUGES.pi);
    dialEl.setAttribute('aria-valuemin', String(band.min));
    dialEl.setAttribute('aria-valuemax', String(band.max));
    // history[0] from the model is the exported constant itself, so the run gets its own copy
    run = {
      era: id,
      qeAt: null,
      t: 1,
      history: [Object.assign({}, era.initial)],
      rate: era.initial.rate,
      moves: [],
      lastMove: 0,
      acceptedCall: false,
      integrity: false,
      peakU: -Infinity,
      busy: false,
      // the politics: the meters per quarter, the events already used, the ladder's rung, the
      // shocks an event has queued for the coming quarter, and the flags the newspaper reads
      politics: [Object.assign({}, FedModel.INITIAL_POLITICS)],
      fired: {},
      stage: 0,
      pending: { demand: 0, supply: 0 },
      promised: false,
      capitulated: false,
      volcker: false,
      ending: null
    };
    show('turn');
    paintTurn({ fresh: true });
  }

  var boardLocked = false;

  /** @param {boolean} locked */
  function lockBoard(locked) {
    nudgeDown.disabled = locked;
    nudgeUp.disabled = locked;
    qeBtn.disabled = locked || !!(run && run.qeAt);
    endTurnBtn.disabled = locked;
    dialEl.setAttribute('aria-disabled', locked ? 'true' : 'false');
    boardLocked = locked;
  }

  /** Draw the board for the quarter the player is now looking at. The END TURN sequence has
   *  already swung the gauges and slid the ticker by the time it calls this, so only a `fresh`
   *  paint — the first quarter of a run — touches those two.
   *  @param {{fresh?:boolean}} [opts] */
  /** Set when END TURN was disabled out from under the keyboard; see paintTurn. */
  var refocusEndTurn = false;

  function paintTurn(opts) {
    var o = opts || {};
    var state = current();
    run.rate = state.rate;                 // the dial opens where last quarter left it
    paintWhen();
    paintMeters(state, currentPol(), previousPol());
    paintPipeline(0);
    paintAdvisors(state);
    paintDial();
    if (o.fresh) { setGauges(state, false); paintTicker(state); }
    lockBoard(false);
    // lockBoard(true) disabled the very button the click came from, which drops focus to <body>
    // ten times a run. It comes back the moment the board is live again.
    if (refocusEndTurn) {
      refocusEndTurn = false;
      try { endTurnBtn.focus({ preventScroll: true }); } catch (err) { endTurnBtn.focus(); }
    }
    endTurnBtn.textContent = run.t === TURNS ? 'End turn · final' : 'End turn';
  }

  /** The topbar's quarter. It moves the moment the quarter does, so an event sheet that opens the
   *  new quarter is never read under the old one's label. */
  function paintWhen() {
    var when = quarterOf(run.t);
    turnLabel.textContent = when.year + ' · Q' + when.q + ' · Chair ' + era.chair;
  }

  /** @param {number} v 0–1 @returns {number} pips lit, 0–5 */
  function pipsOf(v) { return Math.max(0, Math.min(5, Math.round(v * 5))); }

  /** The three meters under the gauges — the street, Washington, credibility — five pips each, and
   *  an arrow on any meter that moved this quarter.
   *  @param {any} state the economy on the board @param {any} pol its meters @param {any} [prev] last quarter's */
  function paintMeters(state, pol, prev) {
    var M = S.POLITICS.meters;
    var specs = [
      { id: 'street', value: pol.street, was: prev ? prev.street : null },
      { id: 'washington', value: pol.washington, was: prev ? prev.washington : null },
      { id: 'cred', value: state.cred, was: null }
    ];
    metersEl.textContent = '';
    specs.forEach(function (spec) {
      var lit = pipsOf(spec.value);
      var moved = spec.was === null ? '' : spec.value > spec.was + 0.02 ? 'up' : spec.value < spec.was - 0.02 ? 'down' : '';
      var meter = fill('meter ' + spec.id);
      var row = fill('meter-row');
      var emoji = chip('meter-emoji', M[spec.id].emoji);
      emoji.setAttribute('aria-hidden', 'true');
      row.appendChild(emoji);
      for (var i = 0; i < 5; i += 1) row.appendChild(chip('pip' + (i < lit ? ' on' : '')));
      meter.appendChild(row);
      meter.appendChild(fill('meter-label', M[spec.id].label + (moved === 'up' ? ' ▲' : moved === 'down' ? ' ▼' : '')));
      meter.setAttribute('role', 'img');
      meter.setAttribute('aria-label', M[spec.id].label + ' ' + lit + ' of 5' + (moved ? ', ' + (moved === 'up' ? 'rising' : 'falling') : ''));
      metersEl.appendChild(meter);
    });
  }

  /** Move this quarter's meters by an event's effects and repaint them.
   *  @param {{street?:number, washington?:number}} effects */
  function nudgePolitics(effects) {
    var prevPol = previousPol();
    run.politics[run.politics.length - 1] = FedModel.bump(currentPol(), effects);
    paintMeters(current(), currentPol(), prevPol);
  }

  /* ===== DIAL — one finger, 2 to 14 percent, a quarter point at a time ===== */

  /** @returns {number} the pixels the thumb's centre may travel across */
  function dialSpan() { return Math.max(1, dialEl.getBoundingClientRect().width - THUMB); }
  /** @param {number} v @returns {number} the thumb's centre, in px from the dial's left edge */
  function dialX(v) {
    return THUMB / 2 + (v - band.min) / (band.max - band.min) * dialSpan();
  }
  /** @returns {{lo:number, hi:number}} the rates this quarter's move limit allows */
  function legalWindow() {
    var prev = current().rate;
    return {
      lo: Math.max(band.min, prev - band.move),
      hi: Math.min(band.max, prev + band.move)
    };
  }

  function paintDial() {
    var win = legalWindow();
    // the highlight is the thumb's legal FOOTPRINT, not the bare value band: two points of rate is
    // exactly one thumb wide, so a band drawn edge to edge would sit under the thumb and never show
    var left = dialX(win.lo) - THUMB / 2;
    dialWindow.style.left = left + 'px';
    dialWindow.style.width = Math.max(0, dialX(win.hi) + THUMB / 2 - left) + 'px';
    dialThumb.style.left = dialX(run.rate) + 'px';

    var bps = Math.round((run.rate - current().rate) * 100);
    rateOut.textContent = run.rate.toFixed(2) + ' %';
    deltaChip.textContent = bps === 0 ? 'no change' : (bps > 0 ? '+' : '−') + Math.abs(bps) + ' bps';
    // At the floor, in an era that has one, the button that cannot cut becomes the one that can: QE.
    var floored = !!era.qe && run.rate <= band.min + 1e-9;
    nudgeDown.hidden = floored;
    qeBtn.hidden = !floored;
    qeBtn.disabled = boardLocked || !!run.qeAt;
    qeBtn.textContent = run.qeAt ? 'QE on' : 'Launch QE';
    dialEl.setAttribute('aria-valuenow', String(run.rate));
    dialEl.setAttribute('aria-valuetext', run.rate.toFixed(2) + ' percent');
    if (pipelineEl.firstChild) pipelineEl.firstChild.textContent = pipeNowLabel();
    paintRealLine();
  }

  function paintRealLine() {
    var pi = current().pi;
    realLine.textContent = 'Real rate = ' + run.rate.toFixed(2) + ' − ' + num(pi) + ' = ' + num(run.rate - pi) + ' %';
  }

  /** @param {number} requested @returns {boolean} true when the dial actually moved */
  function setRate(requested) {
    var next = FedModel.clampRate(requested, current().rate, band);
    if (next === run.rate) return false;
    run.rate = next;
    paintDial();
    return true;
  }

  /** @param {number} step in percentage points */
  function nudge(step) {
    if (boardLocked || guarded()) return;
    if (setRate(run.rate + step)) Arcade.sfx.play('card');
  }

  /** @type {number|null} the one pointer that owns the drag; a second finger is ignored */
  var dragId = null;

  /** @param {number} clientX */
  function dragTo(clientX) {
    var rect = dialEl.getBoundingClientRect();
    var frac = (clientX - rect.left - THUMB / 2) / dialSpan();
    frac = Math.min(1, Math.max(0, frac));
    setRate(band.min + frac * (band.max - band.min));
  }

  dialEl.addEventListener('pointerdown', function (ev) {
    if (boardLocked || guarded() || dragId !== null) return;
    dragId = ev.pointerId;
    try { dialEl.setPointerCapture(ev.pointerId); } catch (err) { /* capture is a nicety */ }
    ev.preventDefault();
    dragTo(ev.clientX);
  });
  dialEl.addEventListener('pointermove', function (ev) {
    if (ev.pointerId !== dragId) return;
    dragTo(ev.clientX);
  });
  function endDrag(ev) {
    if (ev.pointerId !== dragId) return;
    try { dialEl.releasePointerCapture(ev.pointerId); } catch (err) { /* already gone */ }
    dragId = null;
  }
  dialEl.addEventListener('pointerup', endDrag);
  dialEl.addEventListener('pointercancel', endDrag);
  // Chromebooks get the same dial from the keyboard the nudge buttons give a phone — and the whole
  // WAI-ARIA slider pattern, not half of it: Home and End jump to the ends of the quarter's legal
  // window, PageUp and PageDown take the full point in one press.
  dialEl.addEventListener('keydown', function (ev) {
    if (boardLocked || guarded() || !run) return;
    var win = legalWindow();
    var to = null;
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') to = run.rate - band.step;
    else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') to = run.rate + band.step;
    else if (ev.key === 'PageDown') to = run.rate - band.move;
    else if (ev.key === 'PageUp') to = run.rate + band.move;
    else if (ev.key === 'Home') to = win.lo;
    else if (ev.key === 'End') to = win.hi;
    if (to === null) return;
    ev.preventDefault();
    if (setRate(to)) Arcade.sfx.play('card');
  });
  window.addEventListener('resize', function () { if (run) paintDial(); });

  /* ===== GAUGES AND PIPELINE ===== */

  // The rails are the domain a legal rate path really reaches, not the domain a good one does:
  // hiking a point a quarter for four quarters — the strategy the briefing itself teaches — takes
  // the gap past −11 and unemployment past 12, and the old rails printed −8.0 and 12.0 while the
  // ticker, the bloodbath headline and the front page all used the true numbers. Anything still
  // beyond these prints its true figure with the needle marked `pinned`.
  /** The three dials, sized for the crisis: inflation's range and red zone are the era's, and the
   *  natural-rate tick is the era's u*.
   *  @param {{min:number, max:number, red:number}} pi @returns {any[]} */
  function gaugeSpecs(pi) {
    return [
      { id: 'pi', label: 'Inflation π', min: pi.min, max: pi.max, unit: '%', decimals: 1,
        zones: [{ from: 1, to: 3, color: token('--green') }, { from: pi.red, to: pi.max, color: token('--red') }] },
      { id: 'u', label: 'Unemployment u', min: 0, max: 16, unit: '%', decimals: 1, ref: era.params.uStar, refLabel: 'u* = ' + era.params.uStar },
      { id: 'gap', label: 'Output gap', min: -16, max: 9, unit: '%', decimals: 1, ref: 0, refLabel: 'full employment' }
    ];
  }

  /** (Re)build the strip for the crisis in play. @param {{min:number, max:number, red:number}} pi */
  function buildGauges(pi) {
    var specs = gaugeSpecs(pi);
    gaugeStrip.textContent = '';
    gauges = {};
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + (120 * specs.length) + ' 90');
    svg.setAttribute('class', 'gauge-strip');
    svg.style.height = 'auto';
    specs.forEach(function (spec, i) {
      var cell = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      cell.setAttribute('class', 'gauge');
      cell.setAttribute('transform', 'translate(' + (i * 120) + ',0)');
      svg.appendChild(cell);
      gauges[spec.id] = new ArcadeGraph.Gauge(cell, spec);
    });
    gaugeStrip.appendChild(svg);
  }

  /** @param {any} state @param {boolean} animate */
  function setGauges(state, animate) {
    gauges.pi.set(state.pi, { animate: animate, preset: 'consequence' });
    gauges.u.set(state.u, { animate: animate, preset: 'consequence' });
    gauges.gap.set(state.gap, { animate: animate, preset: 'consequence' });
  }

  /** @returns {string} the first chip's label, which tracks the dial as it moves */
  function pipeNowLabel() { return run.rate.toFixed(2) + ' % now' + (run.qeAt ? ' · QE' : ''); }

  /** The three chips are the lag drawn out: what you set now, where it lands, and when.
   *  @param {number} stage 0 the decision, 1 output, 2 inflation */
  function paintPipeline(stage) {
    var labels = [pipeNowLabel(), '→ Q+1 output', '→ Q+2 inflation'];
    pipelineEl.textContent = '';
    labels.forEach(function (text, i) {
      pipelineEl.appendChild(chip('panel pipe-chip' + (i === stage ? ' now' : ''), text));
    });
  }

  /* ===== TICKER AND ADVISORS ===== */

  /** The quarter's scripted headline plus whatever the economy has earned.
   *  @param {any} state */
  function paintTicker(state) {
    var lines = [S.HEADLINES[run.t - 1]];
    var T = S.TICKER;
    var pol = currentPol();
    if (state.pi > 10) lines.push(T.hotPrices);
    if (state.u > 9) lines.push(T.emptyPlatforms);
    if (state.rate - state.pi < -3) lines.push(T.negativeReal);
    if (run.lastMove >= band.move - 1e-9) lines.push(T.bigHike);
    if (pol.street >= 0.75) lines.push(T.angryStreet);
    if (pol.washington >= 0.7) lines.push(T.hillHeat);
    var text = lines.join('   ·   ') + '   ·   ';
    // a fresh node restarts the marquee, which is what makes the ticker "slide" each quarter
    tickerEl.textContent = '';
    var inner = fill('ticker-inner', text + text);
    tickerEl.appendChild(inner);
  }

  /** @param {any} state @returns {{hawk:string, dove:string}} */
  function quipsFor(state) {
    var pol = currentPol();
    var view = {
      pi: state.pi, u: state.u, gap: state.gap, piExp: state.piExp, cred: state.cred,
      rate: state.rate, real: state.rate - state.pi, t: run.t,
      street: pol.street, washington: pol.washington
    };
    for (var i = 0; i < S.QUIPS.length; i += 1) {
      if (S.QUIPS[i].when(view)) return S.QUIPS[i];
    }
    return S.QUIP_FALLBACK;
  }

  /** Hawk speaks first and Dove answers, queued behind him, whenever the voice is on.
   *  @param {any} state */
  function paintAdvisors(state) {
    var pair = quipsFor(state);
    hawkLine.textContent = pair.hawk;
    doveLine.textContent = pair.dove;
    Arcade.say(pair.hawk, { who: 'hawk' });
    Arcade.say(pair.dove, { who: 'dove', interrupt: false });
  }

  /* ===== END TURN SEQUENCE — the gavel, the lag, the consequence ===== */

  /** A wait a tap can cut short. Every pending wait resolves the moment the player skips.
   *  @param {number} ms @returns {Promise<void>} */
  function beat(ms) {
    return new Promise(function (resolve) {
      if (!sequence || sequence.skip) { resolve(); return; }
      var timer = setTimeout(wake, ms);
      function wake() { clearTimeout(timer); resolve(); }
      sequence.wakes.push(wake);
    });
  }

  function skipSequence() {
    if (!sequence || sequence.skip) return;
    sequence.skip = true;
    var pending = sequence.wakes;
    sequence.wakes = [];
    pending.forEach(function (wake) { wake(); });
  }

  function beginSequence() {
    sequence = { skip: false, wakes: [] };
    document.addEventListener('pointerdown', skipSequence);
  }

  function endSequence() {
    document.removeEventListener('pointerdown', skipSequence);
    // The tap that skipped is still in flight: its `click` lands after the whole sequence has
    // finished in microtasks, on whatever is under the finger by then — a nudge or the END TURN
    // button the sequence just re-enabled, the back button (never disabled at all), or a sheet or
    // end-screen button that did not exist when the finger went down. None of them may count, so
    // a skipped sequence deafens the whole board until that tap is spent.
    if (sequence && sequence.skip) Arcade.guardTaps(TIMING.skipGuardSeconds * 1000);
    sequence = null;
  }

  /** @param {string} text */
  function slamStamp(text) {
    fomcStamp.textContent = text;
    fomcStamp.classList.remove('slam');
    fomcMount.hidden = false;
    void fomcStamp.offsetWidth;           // restart the slam on a stamp that is already mounted
    fomcStamp.classList.add('slam');
    Arcade.sfx.play('stamp');
  }

  async function endTurn() {
    if (!run || run.busy || guarded()) return;
    run.busy = true;
    var token = runToken;
    var state = current();
    var rate = run.rate;
    var prev = state.rate;
    refocusEndTurn = document.activeElement === endTurnBtn;
    lockBoard(true);
    beginSequence();

    // the gavel
    slamStamp(S.RATE_NAME + ' ' + rate.toFixed(2) + ' %');
    await beat(BEAT);
    if (!alive(token)) { endSequence(); return; }

    // the pipeline walks: this quarter's rate leaves the room and starts moving output
    paintPipeline(1);
    await beat(BEAT / 2);
    if (!alive(token)) { endSequence(); return; }
    paintPipeline(2);
    await beat(BEAT / 2);
    if (!alive(token)) { endSequence(); return; }

    // the quarter actually happens: the scheduled shocks, plus whatever last quarter's politics queued
    var scheduled = FedModel.eraShocks(run.era, run.t, { acceptedCall: run.acceptedCall, history: run.history, qeAt: run.qeAt });
    var shocks = { demand: scheduled.demand + run.pending.demand, supply: scheduled.supply + run.pending.supply };
    run.pending = { demand: 0, supply: 0 };
    var next = FedModel.step(state, rate, shocks, era.params);
    run.history.push(next);
    run.moves.push({ t: run.t, rate: rate, prev: prev });
    run.lastMove = rate - prev;
    if (next.u > run.peakU) run.peakU = next.u;
    var verdict = FedModel.judgeMove(state, rate, prev, band);
    if (verdict !== null) Arcade.track('4.6', 3, verdict);
    // …and the politics read the quarter it produced. A promise to ease made at the hearing is
    // kept by any cut this quarter and broken by anything else.
    var broke = run.promised && rate >= prev - 1e-9;
    run.promised = false;
    var prevPol = currentPol();
    run.politics.push(FedModel.stepPolitics(prevPol, next, { move: rate - prev, brokenPromise: broke }, P));
    run.t += 1;

    setGauges(next, !sequence.skip);
    if (next.pi < state.pi) Arcade.sfx.play('coin');
    if (next.u > 9 && next.u > state.u) { Arcade.sfx.play('wrong'); gauges.u.flash('red'); }
    paintMeters(next, currentPol(), prevPol);
    if (broke) Arcade.toast('Promise broken — Washington remembers');
    await beat(BEAT);
    if (!alive(token)) { endSequence(); return; }

    fomcMount.hidden = true;
    if (run.t <= TURNS) {
      paintWhen();                       // the new quarter, before its event sheet opens on top
      paintTicker(next);
      await beat(BEAT / 2);
    }
    endSequence();
    if (!alive(token)) return;

    if (run.t > TURNS) { run.busy = false; showNewspaper(); return; }

    var event = S.EVENTS[run.t];
    if (event) await playEvent(event, token);
    if (!alive(token)) return;

    // then the one political event the meters have earned, if any — after the call, so Congress
    // has heard the Chair's answer before it decides what to do about it
    var rule = FedModel.dueEvent(FedModel.politicsView(currentPol(), current(), { stage: run.stage, t: run.t }), run.fired);
    if (rule) await playPolitical(rule, token);
    if (!alive(token)) return;
    if (run.ending) { run.busy = false; showNewspaper(); return; }

    run.busy = false;
    paintTurn();
  }

  /* ===== EVENTS — the four beats, each one opening its quarter ===== */

  /** Set while the sheet is up: the focus trap's release, which also hands focus back. */
  /** @type {(() => void)|null} */ var releaseSheet = null;

  function closeSheet() {
    eventSheet.classList.remove('open');
    eventSheet.setAttribute('aria-hidden', 'true');
    eventButtons.textContent = '';
    if (releaseSheet) { var release = releaseSheet; releaseSheet = null; release(); }
  }

  /** Raise the sheet and wait for a button. A card has one; the call has two.
   *  @param {any} event @param {number} token @returns {Promise<void>} */
  function playEvent(event, token) {
    // the spiral notice only makes the papers in a run where the spiral actually fires
    if (event.firesWhen === 'spiral'
      && FedModel.eraShocks(run.era, run.t, { acceptedCall: run.acceptedCall, history: run.history, qeAt: run.qeAt }).supply <= 0) {
      return Promise.resolve();
    }
    // the deflation notice only makes the papers once prices have actually fallen two quarters running
    if (event.firesWhen === 'deflation') {
      var hist = run.history, n = hist.length;
      if (!(n >= 2 && hist[n - 1].pi < 0 && hist[n - 2].pi < 0)) return Promise.resolve();
    }
    eventEmoji.textContent = event.emoji;
    eventHead.textContent = event.head;
    eventSub.textContent = event.sub;
    eventNote.textContent = event.note;
    eventButtons.textContent = '';
    Arcade.sfx.play(event.sfx);
    Arcade.say(event.head, { who: 'anchor' });

    return new Promise(function (resolve) {
      var settled = false;
      /** @param {() => void} onPick what the button that was chosen does */
      function settle(onPick) {
        if (settled) return;
        settled = true;
        if (alive(token)) onPick();
        closeSheet();
        resolve();
      }
      /** @param {string} label @param {string} cls @param {() => void} onPick */
      function addButton(label, cls, onPick) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = cls;
        btn.textContent = label;
        btn.addEventListener('click', function () { if (!guarded()) settle(onPick); });
        eventButtons.appendChild(btn);
      }

      if (event.kind === 'call') {
        // Neither branch calls Arcade.track. Taking or refusing the call is a values choice, not a
        // Monetary Policy item, and recording it as one put a right/wrong answer on CED 4.6 into
        // the topic diagnostic a teacher pastes into a gradebook. It still costs the run its
        // Integrity point, still feeds the shock schedule, and now moves Washington — it is just
        // not a measurement.
        addButton(event.accept, 'btn btn-ghost btn-block', function () {
          run.acceptedCall = true;
          run.integrity = era.call.integrityFor === 'accept';
          nudgePolitics(FedModel.callBump(era, true, P));
          if (run.integrity) Arcade.toast('\u{1F3C5} Integrity');
        });
        addButton(event.refuse, 'btn btn-block', function () {
          run.acceptedCall = false;
          run.integrity = era.call.integrityFor === 'refuse';
          nudgePolitics(FedModel.callBump(era, false, P));
          if (run.integrity) Arcade.toast('\u{1F3C5} Integrity');
        });
      } else if (event.kind === 'choice') {
        // a political decision: two answers, each with consequences the caller has already wired
        event.choices.forEach(function (c) {
          addButton(c.label, c.primary ? 'btn btn-block' : 'btn btn-ghost btn-block', c.onPick);
        });
      } else {
        // a card is a warning, not a choice; a political card applies its effects on the way out
        addButton(event.button, 'btn btn-block', event.onPick || function () { });
      }
      eventSheet.setAttribute('aria-hidden', 'false');
      eventSheet.classList.add('open');
      // It says aria-modal="true", so it has to behave like one: focus lands inside it and Tab
      // cannot walk out into the board — where #turnBack is never disabled, so a keyboard user
      // could quit the run from inside a "modal". Escape dismisses a card, which is a warning with
      // one button; it does not dismiss the call or a political choice, because those are forced
      // choices and letting a keypress take the independent answer would hand out the integrity
      // point for free.
      var forced = event.kind === 'call' || event.kind === 'choice';
      releaseSheet = Arcade.trapFocus(eventSheet, forced ? null : function () {
        settle(event.onPick || function () { /* acknowledging a card is the whole interaction */ });
      });
    });
  }

  /* ===== POLITICAL EVENTS — what the meters earn, and what the Chair answers ===== */

  /** Raise the sheet for a rule out of FedModel.POLITICAL_EVENTS: a card acknowledges itself, the
   *  hearing and the bill are answered. The words come from S.POLITICS; the
   *  consequences come from FedModel.resolveEvent and land in settlePolitical.
   *  @param {any} rule @param {number} token @returns {Promise<void>} */
  function playPolitical(rule, token) {
    var words = S.POLITICS.events[rule.id];
    if (!words) return Promise.resolve();
    run.fired[rule.id] = true;
    var view = FedModel.politicsView(currentPol(), current(), { stage: run.stage, t: run.t });
    var event = { kind: 'card', sfx: words.sfx, emoji: words.emoji, head: words.head, sub: words.sub, note: words.note, button: words.button };
    if (rule.id === 'hearing') {
      event.kind = 'choice';
      event.choices = [
        { label: words.promise, primary: false, onPick: function () { settlePolitical(rule, 'promise', view); } },
        { label: words.hold, primary: true, onPick: function () { settlePolitical(rule, 'hold', view); } }
      ];
    } else if (rule.id === 'bill') {
      // the note tells the truth about the vote before the Chair answers: the same test resolveEvent applies
      var believed = view.cred >= P.volckerCred || view.real >= P.volckerReal;
      event.kind = 'choice';
      event.note = believed ? words.noteStrong : words.noteWeak;
      event.choices = [
        { label: words.ease, primary: false, onPick: function () { settlePolitical(rule, 'ease', view); } },
        { label: words.hold, primary: true, onPick: function () { settlePolitical(rule, 'hold', view); } }
      ];
    } else {
      event.onPick = function () { settlePolitical(rule, null, view); };
    }
    return playEvent(event, token);
  }

  /** Apply a rule's outcome: the meters move, this quarter's credibility may move, a shock may be
   *  queued for the coming quarter, the ladder climbs a rung, and the bill can end the term.
   *  @param {any} rule @param {string|null} choice @param {any} view the politicsView the rule fired on */
  function settlePolitical(rule, choice, view) {
    var res = FedModel.resolveEvent(rule, choice, view, P);
    var state = current();
    var prevPol = previousPol();
    run.politics[run.politics.length - 1] = FedModel.bump(currentPol(), res.effects);
    if (res.effects.cred) state.cred = Math.max(0, Math.min(1, state.cred + res.effects.cred));
    run.pending.demand += res.effects.demand || 0;
    run.pending.supply += res.effects.supply || 0;
    if (res.flags.promised) { run.promised = true; Arcade.toast(S.POLITICS.events.hearing.promiseToast); }
    if (res.flags.capitulated) { run.capitulated = true; Arcade.toast('Independence bent'); }
    if (res.flags.volcker) { run.volcker = true; Arcade.sfx.play('win'); Arcade.toast('\u{1F3C5} Volcker moment'); }
    if (rule.stage !== undefined) run.stage = rule.stage + 1;
    if (res.ending) run.ending = res.ending;
    paintMeters(state, currentPol(), prevPol);
  }

  /* ===== NEWSPAPER ===== */

  /** @returns {{raw:number, stamp:number}} the integrity point needs the call refused and the bill
   *  not eased into; a term Congress ended is capped by the model */
  function scoreRun() {
    return FedModel.score({ peakU: run.peakU, final: finalState() }, { integrity: run.integrity && !run.capitulated, ended: run.ending, era: run.era });
  }

  /** @param {number} stamp @param {string|null} verdict from FedModel.politicalVerdict @returns {string} */
  function headlineFor(stamp, verdict) {
    var N = S.NEWS, E = S.POLITICS.endings;
    var final = finalState();
    // the politics that ended a term or a Chairmanship outrank the economics; the economics keep
    // their own order beneath them
    if (verdict === 'congress') return E.congress.head;
    if (verdict === 'revolt') return E.revolt.head;
    if (final.pi >= era.score.roaredAbove) return N.roaredBack;
    if (run.peakU >= era.score.bloodbathAbove) return N.bloodbath;
    return N.byStamp[stamp] || N.fallbackHead;
  }

  /** The last row of the report card: what the term did to the Fed's independence — or, where the
   *  era's call was about a bank rather than Washington, what the Chair did about the bank.
   *  @returns {{label:string, value:string}} */
  function callRow() {
    var stat = S.NEWS.callStat;
    if (stat) return { label: stat.label, value: run.acceptedCall ? stat.accept : stat.refuse };
    var word = run.ending === 'congress' ? 'Lost' : run.volcker ? 'Defended' : (run.acceptedCall || run.capitulated) ? 'Bent' : 'Held';
    return { label: 'Independence', value: word };
  }

  /** Three sentences, all of them read off the run — four when the bill cut it short. @returns {string} */
  function newspaperBody() {
    var final = finalState();
    var uStar = era.params.uStar;
    var offBy = Math.abs(final.u - uStar);
    var side = offBy < 0.25 ? 'right at the ' + uStar + ' percent economists call the natural rate'
      : num(offBy) + ' points ' + (final.u > uStar ? 'above' : 'below') + ' the ' + uStar + ' percent economists call the natural rate';
    var opening = run.ending ? 'The term ended after ' + quartersPlayed() + ' quarters, with the dial in other hands. ' : '';
    return opening + 'Inflation leaves the Board at ' + num(final.pi) + ' percent, against the 2 percent this newspaper is told counts as price stability. '
      + 'Unemployment finishes at ' + num(final.u) + ' percent, ' + side + '. '
      + 'At its worst the jobless rate touched ' + num(run.peakU) + ' percent on the Chairman’s watch.';
  }

  /** The earned title, under the stamp, plus the promotion beat when this term moved the player up
   *  a rung. Titles are decoration: nothing here touches the stamp or the score.
   *  @param {any} panel the endScreen panel @param {any} before titleFor() from before the save */
  function showTitle(panel, before) {
    if (!panel) return;
    var after = Arcade.titleFor();
    var rose = after.rank > before.rank;
    var line = fill('title-chip' + (rose ? ' up' : ''), 'Title: ' + after.name + (rose ? ' · 🎉 New title!' : ''));
    var head = panel.querySelector('.end-head');
    head.parentNode.insertBefore(line, head.nextSibling);
    if (rose) Arcade.sfx.play('coin');
  }

  function showNewspaper() {
    runToken += 1;                       // the run is over; nothing still in flight may touch it
    Arcade.voice.stop();
    var result = scoreRun();
    var final = finalState();
    var pol = currentPol();
    var verdict = FedModel.politicalVerdict(pol, { ending: run.ending }, P);
    var N = S.NEWS, E = S.POLITICS.endings;

    newspaperEl.textContent = '';
    newspaperEl.appendChild(fill('np-masthead', N.masthead));
    newspaperEl.appendChild(fill('np-dateline', run.ending ? 'Cedarhurst, New York · ' + quarterLabel(run.t) : N.dateline));
    newspaperEl.appendChild(fill('np-head', headlineFor(result.stamp, verdict)));
    if (verdict === 'congress') newspaperEl.appendChild(fill('np-sub', E.congress.sub));
    else if (verdict === 'revolt') newspaperEl.appendChild(fill('np-sub', E.revolt.sub));
    else if (verdict === 'notReappointed') newspaperEl.appendChild(fill('np-sub', E.notReappointed.sub));
    if (run.acceptedCall && N.acceptedSub) newspaperEl.appendChild(fill('np-sub', N.acceptedSub));
    if (!run.acceptedCall && N.refusedSub) newspaperEl.appendChild(fill('np-sub', N.refusedSub));
    if (run.capitulated) newspaperEl.appendChild(fill('np-sub', E.capitulated.sub));
    newspaperEl.appendChild(fill('np-body', newspaperBody()));
    // the sidebar is the Chair's finest hour, so a Chair who lost the dial does not get one
    if (run.volcker) newspaperEl.appendChild(fill('np-sidebar', E.volcker.sidebar));
    else if (run.integrity && !run.capitulated && verdict !== 'congress' && N.refusedSidebar) newspaperEl.appendChild(fill('np-sidebar', N.refusedSidebar));

    var beforeTitle = Arcade.titleFor();      // the rank as it stood before this term was banked
    Arcade.saveBest('fed', { score: result.stamp, initials: Arcade.initials(), level: era.year });
    saveEraBest(run.era, result.stamp);
    // No track('5.2') here either: a whole ten-quarter run is not one Phillips-curve item, and the
    // student never saw a Phillips curve. The per-quarter judgeMove track on 4.6 is the run's only
    // measurement, and it is a real one.

    show('news');
    var panel = Arcade.endScreen(newsEnd, {
      title: run.ending ? 'THE RECORD · CUT SHORT' : 'THE RECORD',
      sub: run.ending ? quartersPlayed() + ' quarters, then the bill.' : 'Ten quarters, one number a quarter.',
      // the Fed game grades with the AP stamp, not a medal, so the medal slot stays empty
      score: Math.round(result.raw), stamp: result.stamp, medal: null,
      stats: [
        { label: 'Inflation, end of term', value: num(final.pi) + ' %' },
        { label: 'Unemployment, end of term', value: num(final.u) + ' %' },
        { label: 'Worst unemployment', value: num(run.peakU) + ' %' },
        { label: 'Street · Washington', value: pipsOf(pol.street) + ' · ' + pipsOf(pol.washington) + ' of 5' },
        callRow()
      ],
      buttons: [
        { label: 'What really happened →', primary: true, variant: 'gold', onClick: ignoringSkipTap(showHistory) },
        { label: 'Play again', onClick: ignoringSkipTap(startRun) },
        { label: 'Arcade', onClick: ignoringSkipTap(function () { window.location.href = '../index.html'; }) }
      ]
    });
    showTitle(panel, beforeTitle);
    if (result.stamp >= 4) { Arcade.sfx.play('win'); Arcade.confetti(); }
  }

  /* ===== HISTORY — the true sentences, the chart, and the rubric line ===== */

  var SVG_NS = 'http://www.w3.org/2000/svg';
  /** @param {string} tag @param {Record<string, any>} attrs @param {string} [cls] @returns {any} */
  function svgEl(tag, attrs, cls) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(function (key) { node.setAttribute(key, String(attrs[key])); });
    if (cls) node.setAttribute('class', cls);
    return node;
  }

  var CH = { w: 360, h: 200, left: 34, right: 8, top: 12, bottom: 26, yMax: 14 };   // `left` holds "14%"
  /** @param {number} i 0–9 @returns {number} */
  function chartX(i) { return CH.left + (CH.w - CH.right - CH.left) * (i / (TURNS - 1)); }
  /** @param {number} v @returns {number} */
  function chartY(v) {
    var clamped = Math.min(CH.yMax, Math.max(0, v));
    return (CH.h - CH.bottom) - ((CH.h - CH.bottom) - CH.top) * (clamped / CH.yMax);
  }
  /** @param {number[]} series @returns {string} */
  function chartPoints(series) {
    return series.map(function (v, i) { return chartX(i).toFixed(1) + ',' + chartY(v).toFixed(1); }).join(' ');
  }

  var chartSeries = 'pi';

  /** The player's quarters against the ten that happened. history[k] is the state observed at the
   *  start of quarter k + 1, which is exactly what HISTORY_1975[k] measures; a term the bill cut
   *  short draws the quarters it had and stops. */
  /** What the three series are called: on the chart's aria-label, in the legend, and on the button
   *  that brings each one up. @type {Record<string, {name:string, legend:string, next:string}>} */
  var SERIES = {
    pi: { name: 'Inflation', legend: 'Inflation rate (π%)', next: 'u' },
    u: { name: 'Unemployment', legend: 'Unemployment rate (u%)', next: 'rate' },
    rate: { name: 'The federal funds rate', legend: 'Fed funds rate (%)', next: 'pi' }
  };

  function paintChart() {
    var mine = [], theirs = era.history[chartSeries];
    var played = Math.min(TURNS, run.history.length);
    if (chartSeries === 'rate') {
      // a quarter's rate is the one the Chair set in it, which the state after it carries; the
      // opening state's rate is the one Burns inherited, not a decision
      for (var q = 1; q < played; q += 1) mine.push(run.history[q].rate);
      if (run.history[TURNS]) mine.push(run.history[TURNS].rate);
    } else {
      for (var k = 0; k < played; k += 1) mine.push(run.history[k][chartSeries]);
    }

    var svg = svgEl('svg', { viewBox: '0 0 ' + CH.w + ' ' + CH.h }, 'hist-chart');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', SERIES[chartSeries].name + ', your Fed against 1975 to 1977, in percent');
    /** @param {number} x @param {number} y @param {string} anchor @param {string} text */
    function label(x, y, anchor, text) {
      var node = svgEl('text', { x: x, y: y, 'text-anchor': anchor }, 'hist-label');
      node.textContent = text;
      svg.appendChild(node);
    }
    for (var v = 0; v <= CH.yMax; v += 2) {
      svg.appendChild(svgEl('line', { x1: CH.left, y1: chartY(v), x2: CH.w - CH.right, y2: chartY(v) }, 'hist-grid'));
      label(CH.left - 5, chartY(v) + 4, 'end', v + '%');       // the axis says what it is measuring in
    }
    svg.appendChild(svgEl('line', { x1: CH.left, y1: CH.top, x2: CH.left, y2: CH.h - CH.bottom }, 'hist-axis'));
    [0, 4, 8].forEach(function (i) { label(chartX(i), CH.h - 8, 'middle', quarterLabel(i + 1)); });
    svg.appendChild(svgEl('polyline', { points: chartPoints(theirs) }, 'hist-line actual'));
    svg.appendChild(svgEl('polyline', { points: chartPoints(mine) }, 'hist-line player'));

    chartMount.textContent = '';
    chartMount.appendChild(svg);
    paintLegend();
    chartToggle.textContent = 'Show ' + SERIES[SERIES[chartSeries].next].name.toLowerCase();
  }

  /** The legend names the series the chart is showing, in the CED's own words and units, then the
   *  two lines. It repaints with the chart, so the toggle renames it too. */
  function paintLegend() {
    chartLegend.textContent = '';
    chartLegend.appendChild(chip('tag hist-series', SERIES[chartSeries].legend));
    chartLegend.appendChild(chip('hist-key player'));
    chartLegend.appendChild(chip('muted', 'Your Fed'));
    chartLegend.appendChild(chip('hist-key actual'));
    chartLegend.appendChild(chip('muted', '1975–77 actual'));
  }

  /** @returns {string} 'hike', 'cut' or 'hold' — whichever the player did most of */
  function dominantMove() {
    var hikes = 0, cuts = 0;
    run.moves.forEach(function (m) {
      if (m.rate > m.prev + 1e-9) hikes += 1;
      else if (m.rate < m.prev - 1e-9) cuts += 1;
    });
    if (hikes > cuts) return 'hike';
    if (cuts > hikes) return 'cut';
    return 'hold';
  }

  function showHistory() {
    historyText.textContent = '';
    S.HISTORY.forEach(function (line) { historyText.appendChild(fill('', line)); });
    historyText.appendChild(fill('', S.HISTORY_POLITICS));
    historyText.appendChild(fill('muted', S.HISTORY_NOTE));

    chartSeries = 'pi';
    paintChart();
    // two rubric sentences: the move the player made most, and the one the politics were about
    frqLine.textContent = '';
    frqLine.appendChild(fill('', S.FRQ[dominantMove()]));
    frqLine.appendChild(fill('muted', S.FRQ.independence));
    if (S.FRQ.era) frqLine.appendChild(fill('muted', S.FRQ.era));
    show('history');
  }

  /** The title screen's "what is this game?" panel, painted from INTRO. */
  function paintIntro() {
    introEl.textContent = '';
    var title = fill('intro-title', 'What is this game?');
    title.id = 'introTitle';
    introEl.appendChild(title);
    INTRO.forEach(function (line) {
      var row = fill('intro-line');
      var emoji = fill('intro-emoji', line.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      row.appendChild(emoji);
      row.appendChild(fill('intro-text', line.text));
      introEl.appendChild(row);
    });
  }

  chartToggle.addEventListener('click', function () {
    chartSeries = SERIES[chartSeries].next;     // inflation, unemployment, the rate, and round again
    paintChart();
  });

  /* ===== HOW TO PLAY — once between the briefing and the first quarter, and from every ? ===== */

  /** What "Got it" does, and what ← does: the rules shown on the way into a term go on into it,
   *  but backing out of them returns to the briefing rather than taking the chair. */
  /** @type {(() => void)|null} */ var howtoAfter = null;
  /** @type {(() => void)|null} */ var howtoBackTo = null;

  /** @param {string} id @returns {boolean} whether this crisis's rules have been read */
  function howtoSeen(id) {
    var saved = Arcade.store.get('arcade.fed.howto', null);
    var seen = saved && Array.isArray(saved.seen) ? saved.seen : [];
    return seen.indexOf(id) >= 0;
  }

  /** @param {string} id */
  function markHowtoSeen(id) {
    var saved = Arcade.store.get('arcade.fed.howto', null);
    var seen = saved && Array.isArray(saved.seen) ? saved.seen.filter(function (v) { return typeof v === 'string'; }) : [];
    if (seen.indexOf(id) < 0) seen.push(id);
    Arcade.store.set('arcade.fed.howto', { seen: seen });
  }

  /** The crisis's own twist first, then the rules every crisis shares. */
  function paintHowto() {
    howtoCards.textContent = '';
    [S.HOWTO_ERA].concat(HOWTO).forEach(function (card) {
      var panel = fill('panel howto-card');
      var emoji = fill('howto-emoji', card.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      panel.appendChild(emoji);
      var body = fill('');
      body.appendChild(fill('howto-head', card.head));
      body.appendChild(fill('howto-body', card.body));
      panel.appendChild(body);
      howtoCards.appendChild(panel);
    });
  }

  /** @param {() => void} after what "Got it" does @param {() => void} [back] what ← does */
  function openHowto(after, back) {
    howtoAfter = after;
    howtoBackTo = back || after;
    paintHowto();
    show('howto');
  }

  /** @param {boolean} [backwards] true when ← was the way out */
  function closeHowto(backwards) {
    var go = backwards === true ? howtoBackTo : howtoAfter;
    howtoAfter = null;
    howtoBackTo = null;
    if (go) go();
  }

  /** The briefing's own button: the rules the first time, then straight to the chair. */
  function takeTheGavel() {
    var id = pendingEra;
    if (howtoSeen(id)) { startRun(id); return; }
    // Marked by "Got it", not by arriving: backing out with ← leaves the rules unread, and the
    // next "Take the gavel" should still open on them.
    openHowto(function () { markHowtoSeen(id); startRun(id); }, function () { show('briefing'); });
  }

  /* ===== ERA AND BRIEFING ===== */

  /** @returns {Record<string, number>} the best stamp per crisis on this device */
  function eraBests() {
    var p = Arcade.store.get('arcade.fed.progress', null);
    return p && typeof p === 'object' ? p : {};
  }

  /** @param {string} id @param {number} stamp */
  function saveEraBest(id, stamp) {
    var p = eraBests();
    if (!(Number(p[id]) >= stamp)) p[id] = stamp;
    Arcade.store.set('arcade.fed.progress', p);
  }

  function paintEras() {
    var bests = eraBests();
    eraList.textContent = '';
    FedModel.ERA_IDS.forEach(function (id) {
      var e = FedModel.ERAS[id];
      var tile = fill('panel level-tile');
      tile.setAttribute('role', 'button');
      tile.setAttribute('tabindex', '0');
      tile.setAttribute('aria-label', 'Play ' + id + ', Chair ' + e.chair);
      tile.appendChild(fill('level-num', id));

      var info = fill('');
      info.setAttribute('style', 'flex:1;min-width:0');
      info.appendChild(fill('panel-title', 'Chair ' + e.chair));
      info.appendChild(fill('muted', SCENARIOS[id].tile.blurb));
      var best = Number(bests[id]);
      if (Number.isFinite(best) && best > 0) {
        var badges = fill('row');
        badges.appendChild(chip('tag', 'Best stamp ' + Math.min(5, Math.max(1, Math.floor(best)))));
        info.appendChild(badges);
      }
      tile.appendChild(info);

      tile.addEventListener('click', function () { showBriefing(id); });
      tile.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showBriefing(id); }
      });
      eraList.appendChild(tile);
    });
  }

  /** Point the board at a crisis and open its desk memo. @param {string} id */
  function showBriefing(id) {
    pendingEra = id;
    era = FedModel.ERAS[id];
    S = SCENARIOS[id];
    band = era.band;
    P = FedModel.politicsFor(id);
    briefingTitle.textContent = 'Your desk, January ' + id;
    briefingText.textContent = '';
    S.briefing.forEach(function (para) { briefingText.appendChild(fill('', para)); });
    show('briefing');
  }

  /* ===== BOOT ===== */

  /* Every crisis says what it must; the rest it borrows from 1975: the meter names, the generic
     advisor lines and their fallback, the three FRQ rubric lines and the independence line, and
     any ticker line it did not rewrite. A call the words and the model disagree on is a bug. */
  FedModel.ERA_IDS.forEach(function (id) {
    var sc = SCENARIOS[id];
    if (sc !== SCENARIO_1975) {
      sc.POLITICS.meters = sc.POLITICS.meters || S.POLITICS.meters;
      sc.QUIPS = sc.QUIPS.concat(S.QUIPS);
      sc.QUIP_FALLBACK = sc.QUIP_FALLBACK || S.QUIP_FALLBACK;
      sc.FRQ = Object.assign({}, S.FRQ, sc.FRQ);
      sc.TICKER = Object.assign({}, S.TICKER, sc.TICKER);
    }
    var callWords = sc.EVENTS[FedModel.ERAS[id].call.t];
    if (!callWords || callWords.kind !== 'call') console.warn('fed-chair: ' + id + ' has no call words on quarter ' + FedModel.ERAS[id].call.t);
  });

  Arcade.bigType(Arcade.store.get('arcade.bigType', false));
  Arcade.sfx.bindMuteButton(byId('muteBtn'));
  Arcade.voice.bindButton(byId('voiceBtn'));
  Arcade.mountSwitcher({ current: 'fed' });
  buildGauges(S.GAUGES.pi);
  paintIntro();
  lockBoard(true);

  initialsBtn.textContent = Arcade.initials();
  initialsBtn.addEventListener('click', function () {
    if (!initialsPanel.hidden) { initialsPanel.hidden = true; return; }
    initialsPanel.hidden = false;
    Arcade.initialsEntry(initialsMount, {
      onDone: function (value) {
        initialsBtn.textContent = value;
        initialsPanel.hidden = true;
      }
    });
  });

  byId('playBtn').addEventListener('click', goEra);
  byId('eraBack').addEventListener('click', function () { abandonRun(); show('title'); });
  byId('briefingBack').addEventListener('click', goEra);
  byId('briefingStart').addEventListener('click', takeTheGavel);
  byId('howtoBack').addEventListener('click', function () { closeHowto(true); });
  byId('howtoGo').addEventListener('click', function () { closeHowto(false); });
  byId('turnHowto').addEventListener('click', ignoringSkipTap(function () {
    // Turn-based: there is no clock to pause, so the board is simply where it was left.
    openHowto(function () { show('turn'); });
  }));
  byId('turnBack').addEventListener('click', ignoringSkipTap(goEra));
  byId('historyBack').addEventListener('click', function () { show('news'); });
  nudgeDown.addEventListener('click', function () { nudge(-band.step); });
  nudgeUp.addEventListener('click', function () { nudge(band.step); });
  qeBtn.addEventListener('click', function () {
    if (boardLocked || guarded() || !run || run.qeAt || !era.qe) return;
    run.qeAt = run.t;                    // counts from this quarter's step on, as the model reads it
    Arcade.sfx.play('win');
    Arcade.toast('QE launched — bond buying adds demand every quarter from now on');
    paintDial();
    paintPipeline(0);
  });
  endTurnBtn.addEventListener('click', function () { endTurn(); });

  paintEras();
  var wanted = String(Arcade.qs('era', ''));
  if (SCENARIOS[wanted]) {
    showBriefing(wanted);
  } else if (wanted) {
    show('era');
    Arcade.toast(wanted + ' is not a crisis here');
  }
  booted = true;      // whatever the boot did or did not show, the next one is the student's doing
}());
</script>

</body>
</html>
