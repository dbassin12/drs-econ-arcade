/* ================================================================================

const TIMING = {

/* ================================================================================

const HOWTO = [

<script>
/* ================================================================================
   SHIFT HAPPENS — the game. Sections: elements · screens · progress · level select ·
   card logic (pure) · round chrome · round loop · boss · exam sprint · the run ·
   end screens · boot.
   During play the student's only input is dragging a curve on the graph (Level 3 adds
   one tap to name the gap the shock left behind); multiple choice appears nowhere but
   the Exam Sprint. The gauges swing as the consequence, and every scored answer calls
   Arcade.track exactly once.
   ================================================================================ */
(function () {
  'use strict';
  if (typeof Arcade === 'undefined' || typeof ArcadeGraph === 'undefined') return;

  var SHIFT_UNITS = 12;   // where a recognised drag lands — SNAP in shared/graph.js
  var SLIDE_UNITS = 10;   // how far a movement along a curve travels — the engine's dot step
  // Every clock below is TIMING, at the top of this file, turned into milliseconds. Nothing here
  // is a number to edit: edit TIMING.
  var EXTEND_MS = TIMING.extendSeconds * 1000;
  var GAP_MS = TIMING.gapSeconds * 1000;
  var WARN_MS = TIMING.warnSeconds * 1000;
  var CARD_IN_MS = TIMING.cardInSeconds * 1000;
  var GRACE_MS = TIMING.readGrace * 1000;
  var EXAM_MS = TIMING.examSeconds * 1000;
  var WHY_MS = TIMING.whySeconds * 1000;
  var GAP_POINTS = 50;    // what naming the gap is worth, before the streak multiplier
  var EXAM_FRAME = 'Now say it the way the exam asks — 3 questions, ' + TIMING.examSeconds + ' s each';
  var HEARTS = 3;
  var ROUNDS = 8;         // cards drawn from the pool before the boss
  var KEYS = 'ABCD';

  /** What the graph is showing, and the sentence that earns the point for naming it. */
  var GAP_LABEL = { recessionary: 'Recessionary gap', inflationary: 'Inflationary gap', none: 'At full employment' };
  var GAP_WHY = {
    recessionary: 'Short-run equilibrium real GDP is below full-employment output, so the economy is in a recessionary gap and the unemployment rate is above the natural rate.',
    inflationary: 'Short-run equilibrium real GDP is above full-employment output, so the economy is in an inflationary gap and the unemployment rate is below the natural rate.',
    none: 'Short-run equilibrium real GDP equals full-employment output, so there is no output gap and the economy is in long-run equilibrium.'
  };

  /* ===== ELEMENTS ===== */

  /** @param {string} id @returns {any} */
  function byId(id) { return document.getElementById(id); }
  /** @param {number} ms @returns {Promise<void>} */
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  /** @param {string} cls @param {string} text @returns {any} */
  function fill(cls, text) {
    var node = document.createElement('div');
    node.className = cls;
    node.textContent = text;
    return node;
  }
  /** @param {string} cls @param {string} text @returns {any} a phrasing node, legal inside a button */
  function chip(cls, text) {
    var node = document.createElement('span');
    node.className = cls;
    node.textContent = text;
    return node;
  }

  var screens = {
    title: byId('screen-title'), select: byId('screen-select'), howto: byId('screen-howto'),
    play: byId('screen-play'), exam: byId('screen-exam'), end: byId('screen-end')
  };
  var levelList = byId('levelList');
  var initialsBtn = byId('initialsBtn'), initialsPanel = byId('initialsPanel'), initialsMount = byId('initialsMount');
  var heartsEl = byId('hearts'), comboEl = byId('combo'), scoreEl = byId('score'), timerEl = byId('timer');
  var breakingEl = byId('breaking'), breakingEmoji = byId('breakingEmoji'), breakingBody = byId('breakingBody');
  var graphWrap = byId('graphWrap'), hintEl = byId('hint');
  var examTimerEl = byId('examTimer'), examCountEl = byId('examCount'), examSubEl = byId('examSub');
  var examStemEl = byId('examStem'), examChoicesEl = byId('examChoices');
  var sheet = byId('sheet'), sheetMsg = byId('sheetMsg'), sheetWhy = byId('sheetWhy'), sheetBtn = byId('sheetBtn');
  var sheetChips = byId('sheetChips'), stampMount = byId('stampMount'), stampText = byId('stampText');
  var kbdRow = byId('kbdRow'), graphRead = byId('graphRead');
  var howtoTitle = byId('howtoTitle'), howtoCards = byId('howtoCards'), howtoDemoEl = byId('howtoDemo');
  var modeTag = byId('modeTag'), practiceBtn = byId('practiceBtn'), introEl = byId('intro');

  /** The live graph, and the market it is drawing. Each level mounts its own market from the
   *  engine's data — the same svg and hit plane, re-labelled — so Level 4 is a money market and
   *  Level 7 a Phillips curve without a line of graph code in this file.
   *  @type {any} */
  var graph = null;
  var graphMarket = '';

  /** @param {string} market an ArcadeGraph.MARKETS key @returns {any} the graph, mounted and locked */
  function mountGraph(market) {
    if (graph && graphMarket === market) return graph;
    if (graph) graph.destroy();
    graph = ArcadeGraph.create(graphWrap, { market: market, gauges: true, readout: graphRead });
    graphMarket = market;
    graph.lock();
    return graph;
  }

  /** @param {string} name a curve @returns {string} what the graph calls it — "S$", not "S" */
  function curveLabel(name) {
    var mk = ArcadeGraph.MARKETS[graphMarket] || ArcadeGraph.MARKETS.adas;
    var c = mk.curves[name];
    return c && c.label ? c.label : name;
  }

  /** The run in progress. `token` is what tells an awaiting round it has been abandoned. */
  var run = null;
  var runToken = 0;
  /** The Exam Sprint in progress, on its own token so a run and a sprint cannot abandon each other. */
  var exam = null;
  var examToken = 0;
  /** @param {number} token @returns {boolean} false once the student has quit, replayed or finished */
  function alive(token) { return token === runToken; }
  /** @param {number} token @returns {boolean} false once the sprint has been left */
  function examAlive(token) { return token === examToken; }

  /* ===== SCREENS ===== */

  /** Swap screens, deafen the page for a moment, and take the keyboard with you.
   *  The guard is what stops a double tap doing two things: the second `click` of a double tap is
   *  delivered after the swap, on whatever now occupies that coordinate — the next screen's back
   *  button in the identical 48 px box, or a freshly rendered exam choice. The focus move is what
   *  stops a keyboard restarting at the top of the document on every navigation.
   *  @param {string} name a key of `screens` */
  /** True once the page is past its boot. Only a ?level= deep link makes the boot call show() at
   *  all — the title screen is already `active` in the markup — and arming the tap guard on that one
   *  call would make the deep link deaf for 350 ms after load. Every other load sets this at the end
   *  of boot, so the student's first tap on PLAY is guarded like any other screen change: it is the
   *  most likely double tap in the whole app. */
  var booted = false;

  function show(name) {
    Object.keys(screens).forEach(function (key) { screens[key].classList.toggle('active', key === name); });
    if (booted) Arcade.guardTaps();
    booted = true;
    Arcade.focusScreen(screens[name]);
  }

  /** Abandon whatever round, gap tap or sprint question is awaiting an answer, and leave the graph
   *  inert. Every clock's stop() resolves its waiter, so nothing is left hanging. */
  function abortRun() {
    runToken += 1;
    examToken += 1;
    if (run && run.clock) run.clock.stop();
    if (run && run.gapClock) run.gapClock.stop();
    if (exam && exam.stop) exam.stop();
    ackNow();
    hideSheet();
    showKbdGap(false);
    graph.lock();
    Arcade.voice.stop();
  }

  /* ===== PROGRESS — arcade.shift.progress ===== */

  /** @returns {{unlocked:number, levels:Object<string, any>}} */
  function loadProgress() {
    var p = Arcade.store.get('arcade.shift.progress', null);
    if (!p || typeof p !== 'object') p = {};
    // Every record is checked, not just the map that holds them. A hand-edited or half-written
    // `{"levels":{"1":5}}` used to reach `rec.cleared = true` on a number, which throws under
    // 'use strict' out of an un-caught async chain: no CLEAR screen, the play screen frozen with
    // the graph locked, and only a reload to get out. A junk record is simply not a record.
    var levels = {};
    var raw = p.levels && typeof p.levels === 'object' ? p.levels : {};
    Object.keys(raw).forEach(function (key) {
      if (raw[key] && typeof raw[key] === 'object') levels[key] = raw[key];
    });
    return {
      unlocked: typeof p.unlocked === 'number' && p.unlocked >= 1 ? p.unlocked : 1,
      levels: levels
    };
  }

  /** @returns {any} an untouched level record */
  function blankRecord() {
    return { cleared: false, acc: 0, best: 0, medal: null, exam: null, examPerfect: false };
  }

  /** Medal and ribbon are always derived, never written by hand: gold needs 95% on the level *and*
   *  2 of 3 in the sprint, and the "Exam Ready" ribbon needs a clean sweep on top of that accuracy.
   *  @param {any} rec @returns {any} the same record */
  function rescore(rec) {
    rec.medal = Arcade.medalFor(rec.acc, { examPassed: !!(rec.exam && rec.exam.right >= 2) });
    rec.examPerfect = !!(rec.exam && rec.exam.total > 0 && rec.exam.right === rec.exam.total && rec.acc >= 0.95);
    return rec;
  }

  /** Record a cleared level: the best score and best accuracy are kept, the medal is recomputed
   *  from that accuracy and whatever the Exam Sprint has stored, and 75% unlocks the next level.
   *  @param {number} n @param {number} score @param {number} acc 0-1 */
  function saveProgress(n, score, acc) {
    var p = loadProgress();
    var rec = p.levels[String(n)] || blankRecord();
    rec.cleared = true;
    rec.acc = Math.max(rec.acc || 0, acc);
    rec.best = Math.max(rec.best || 0, score);
    p.levels[String(n)] = rescore(rec);
    if (rec.acc >= 0.75) p.unlocked = Math.max(p.unlocked, n + 1);
    Arcade.store.set('arcade.shift.progress', p);
  }

  /** Record an Exam Sprint. The run score is untouched — the sprint only ever moves the medal and
   *  the ribbon — and the best sprint stands, the same way the best score and accuracy do.
   *  @param {number} n @param {number} right @param {number} total @returns {any} the level record */
  function saveExam(n, right, total) {
    var p = loadProgress();
    var rec = p.levels[String(n)] || blankRecord();
    if (!rec.exam || right > rec.exam.right) rec.exam = { right: right, total: total };
    p.levels[String(n)] = rescore(rec);
    Arcade.store.set('arcade.shift.progress', p);
    return rec;
  }

  /* ===== LEVEL SELECT ===== */

  /** @param {number} n @returns {any} the level, or undefined */
  function levelOf(n) {
    for (var i = 0; i < LEVELS.length; i += 1) if (LEVELS[i].n === n) return LEVELS[i];
    return undefined;
  }

  /** @param {number} n @returns {boolean} built and unlocked */
  function playable(n) {
    var L = levelOf(n);
    return !!(L && L.ready && n <= loadProgress().unlocked);
  }

  /** A tile is two real controls in one panel: the body plays the level, the chip beside it replays
   *  the Exam Sprint. Neither is nested inside the other, so each answers its own taps and its own
   *  keys, and the number, name, best, badges and medal all ride one row.
   *  @param {any} L a level @param {any} rec its saved record, or null @param {boolean} locked
   *  @returns {any} the tile */
  function levelTile(L, rec, locked) {
    var tile = document.createElement('div');
    tile.className = 'panel level-tile' + (locked ? ' locked' : '');

    var medal = Arcade.safeMedal(rec && rec.medal);   // stored strings never pick their own class
    var open = document.createElement('button');
    open.type = 'button';
    open.className = 'tile-open';
    open.disabled = locked;
    open.setAttribute('aria-label', (locked ? 'Locked: level ' : 'Play level ') + L.n + ', ' + L.name
      + (medal === 'none' ? '' : ', ' + medal + ' medal'));
    open.appendChild(chip('level-num', String(L.n)));

    var info = chip('tile-info', '');
    info.appendChild(chip('tile-name', L.name + (locked ? ' 🔒' : '')));
    var meta = chip('tile-meta', '');
    meta.appendChild(chip('muted', rec && rec.cleared
      ? 'Best ' + rec.best + ' · ' + Math.round(rec.acc * 100) + '%'
      : !L.ready ? 'Coming soon' : locked ? 'Locked' : 'Not played yet'));
    if (!L.ready) meta.appendChild(chip('tag', 'P1'));                 // built in the next phase
    if (rec && rec.exam) meta.appendChild(chip('tag', 'Sprint ' + rec.exam.right + '/' + rec.exam.total));
    if (rec && rec.examPerfect) meta.appendChild(chip('ribbon', 'Exam Ready'));
    info.appendChild(meta);
    open.appendChild(info);
    open.appendChild(chip('medal ' + medal, medal === 'none' ? '—' : medal.charAt(0).toUpperCase()));
    if (!locked) open.addEventListener('click', function () { startLevel(L.n); });
    tile.appendChild(open);

    // The sprint replays on its own, without replaying the level it belongs to.
    if (L.ready && rec && rec.cleared) {
      var sprint = document.createElement('button');
      sprint.type = 'button';
      sprint.className = 'btn btn-ghost tile-btn';
      sprint.textContent = 'Exam Sprint';
      sprint.setAttribute('aria-label', 'Exam Sprint for level ' + L.n);
      sprint.addEventListener('click', function () { startExam(L.n); });
      tile.appendChild(sprint);
    }
    return tile;
  }

  function paintSelect() {
    var progress = loadProgress();
    levelList.textContent = '';
    LEVELS.forEach(function (L) {
      levelList.appendChild(levelTile(L, progress.levels[String(L.n)] || null,
        !L.ready || L.n > progress.unlocked));
    });
  }

  /* ===== CARD LOGIC — pure; no DOM, no run state ===== */

  /** What one asked-for gesture is. A boss's `moves` entries carry no `kind` of their own, so
   *  anything that does not say 'move' is a shift.
   *  @param {{kind?:string}} m a card or one boss move @returns {string} 'shift' or 'move' */
  function kindOf(m) { return m && m.kind === 'move' ? 'move' : 'shift'; }

  /** Where a card starts every curve of its market: what it says, else zero.
   *  @param {any} card @param {string} market @returns {Object<string, number>} */
  function startShifts(card, market) {
    var out = {};
    Object.keys(ArcadeGraph.MARKETS[market].curves).forEach(function (name) {
      out[name] = card.start && typeof card.start[name] === 'number' ? card.start[name] : 0;
    });
    return out;
  }

  /** @param {string} market @returns {string} the market's first draggable, sloped curve — where a
   *  'any' movement along is drawn (AD on the AD–AS graph) */
  function firstSloped(market) {
    var curves = ArcadeGraph.MARKETS[market].curves;
    var names = Object.keys(curves);
    for (var i = 0; i < names.length; i += 1) if (curves[names[i]].draggable && !curves[names[i]].vertical) return names[i];
    return names[0];
  }

  /** The true outcome of a card, played after every answer whether or not the student found it.
   *  A shift lands the curve 12 units left or right of where the card started it; a movement along
   *  slides the dot 10 units along its curve — up the curve for 'up', the same rule the engine's
   *  own drag uses — and a boss applies its moves in turn, so a boss that mixes a shift with a
   *  movement along ends on the dot slid away from where its shift put the curve.
   *  @param {any} card @param {string} market the level's ArcadeGraph.MARKETS key
   *  @returns {{shifts:Object<string, number>, point?:{curve:string, x:number}}} */
  function computeResult(card, market) {
    var mk = ArcadeGraph.MARKETS[market];
    var start = startShifts(card, market);
    var moves = card.kind === 'boss' ? card.moves : [card];
    var slide = null;
    moves.forEach(function (m) {
      if (kindOf(m) === 'move') { slide = m; return; }
      start[m.curve] += (m.dir === 'R' ? SHIFT_UNITS : -SHIFT_UNITS);
    });
    if (!slide) return { shifts: start };
    var curve = slide.curve === 'any' ? firstSloped(market) : slide.curve;   // 'any' accepts either
    var c = mk.curves[curve];
    // the dot starts where the market keeps it: at the crossing, or at the fixed point a Phillips
    // curve is read at
    var fromX = mk.point ? mk.point.x : (ArcadeGraph.intersect(market, start) || { x: 50 }).x;
    var away = (c.m > 0 ? 1 : -1) * (slide.dir === 'up' ? 1 : -1);
    return { shifts: start, point: { curve: curve, x: fromX + SLIDE_UNITS * away } };
  }

  /** The reading a market gives at a state: its outputs at the crossing, at the point a movement
   *  along left the dot, or at a Phillips curve's fixed point.
   *  @param {string} market @param {Object<string, number>} shifts @param {{curve:string, x:number}|null} point
   *  @returns {Object<string, number>} */
  function readingAt(market, shifts, point) {
    var mk = ArcadeGraph.MARKETS[market];
    var at = point || mk.point || null;
    var pt;
    if (at) {
      var c = mk.curves[at.curve];
      pt = { x: at.x, y: c.m * (at.x - (shifts[at.curve] || 0)) + c.b };
    } else {
      pt = ArcadeGraph.intersect(market, shifts) || { x: 50, y: 50 };
    }
    return ArcadeGraph.outputs(market, pt);
  }

  /** @param {any} ans a graph `release` payload, or null when the clock won
   *  @param {any} card the card or one boss move @returns {boolean} */
  function judge(ans, card) {
    if (!ans) return false;
    if (kindOf(card) === 'move') {
      return ans.kind === 'move' && (card.curve === 'any' || ans.curve === card.curve) && ans.dir === card.dir;
    }
    return ans.kind === 'shift' && ans.curve === card.curve && ans.dir === card.dir;
  }

  /** @param {{kind?:string, curve:string, dir:string}} card @returns {string} what it asked for */
  function truthOf(card) {
    if (kindOf(card) === 'move') {
      return 'Movement along ' + (card.curve === 'any' ? 'the curve' : curveLabel(card.curve)) + ', ' + card.dir;
    }
    return curveLabel(card.curve) + ' shifts ' + (card.dir === 'R' ? 'right' : 'left');
  }

  /** The gap the graph is showing right now, read with the same test the engine grades a tap by, so
   *  the band the student aims at can never disagree with the answer they are marked against.
   *  `out.gap` is 0.8 gauge points per graph unit, hence the 0.008 deadband.
   *  @returns {string} 'recessionary' | 'inflationary' | 'none' */
  function gapNow() {
    var g = graph.state().out.gap;
    return g < -0.008 ? 'recessionary' : g > 0.008 ? 'inflationary' : 'none';
  }

  /** Fisher-Yates, on a copy. @param {any[]} list @returns {any[]} */
  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = a[i]; a[i] = a[j]; a[j] = swap;
    }
    return a;
  }

  /** The hand for one run: `count` cards, with two trick cards guaranteed when the pool has them.
   *  @param {any[]} pool @param {number} count @returns {any[]} */
  function drawCards(pool, count) {
    var tricks = shuffled(pool.filter(function (c) { return c.trick; })).slice(0, Math.min(2, count));
    // The rest are drawn by weight: a topic the tracker has seen this student miss comes up more
    // often, one they own comes up less, so a replay is a drill of what needs it. Two trick cards
    // are still guaranteed, because the trap is the level's point.
    var rest = pool.filter(function (c) { return tricks.indexOf(c) < 0; });
    var weights = rest.map(function (c) { return Arcade.cardWeight(c.ced); });
    var picked = Arcade.weightedSample(rest, weights, Math.max(0, count - tricks.length));
    return shuffled(tricks.concat(picked));
  }

  /** The consequence, read off a card's true outcome: which way each of the market's gauges moved
   *  between where the card started and where it ends. A boss reads its whole outcome, so two
   *  shifts that cancel on the price level say so. The dollar market adds the two words the exam
   *  wants — appreciates or depreciates — and what that does to net exports.
   *  @param {any} card @param {string} market @returns {string[]} read-outs, e.g. "Price Level ▲" */
  function chipsFor(card, market) {
    var mk = ArcadeGraph.MARKETS[market];
    var before = readingAt(market, startShifts(card, market), null);
    var after = readingAt(market, card.result.shifts, card.result.point || null);
    /** @param {number} d @returns {string} */
    function arrow(d) { return d > 0.05 ? '▲' : d < -0.05 ? '▼' : '—'; }
    var chips = mk.gauges.map(function (spec) { return spec.label + ' ' + arrow(after[spec.from] - before[spec.from]); });
    if (market === 'forex') {
      var d = after.e - before.e;
      chips.push(d > 0.05 ? '$ appreciates ▲' : d < -0.05 ? '$ depreciates ▼' : '$ unchanged —');
      chips.push('Net exports ' + arrow(-d));
    }
    return chips;
  }

  /* ===== ROUND CHROME — the breaking card, the verdict sheet and the clock ===== */

  /** @param {boolean[]} done @returns {number} the first boss move still to find, or -1 */
  function firstPending(done) {
    for (var i = 0; i < done.length; i += 1) if (!done[i]) return i;
    return -1;
  }

  /** @param {any} card @param {boolean[]|null} done which boss moves are solved, null for a card.
   *  A boss that takes its moves in either order shows every unsolved headline as live.
   *  @param {string} [label] what the red tag says instead of "Breaking" — the tutorial's card */
  function paintCard(card, done, label) {
    breakingEmoji.textContent = card.emoji;
    breakingBody.textContent = '';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = label || (card.kind === 'boss' ? 'Breaking · Boss' : 'Breaking');
    breakingBody.appendChild(tag);
    if (card.kind === 'boss' && done) {
      var next = firstPending(done);
      card.moves.forEach(function (move, i) {
        var live = !done[i] && (card.anyOrder || i === next);
        var mark = done[i] ? '✓ ' : live ? '▶ ' : '· ';
        breakingBody.appendChild(fill(live ? 'breaking-head' : 'breaking-sub', mark + move.head));
      });
    } else {
      breakingBody.appendChild(fill('breaking-head', card.head));
    }
    breakingBody.appendChild(fill('breaking-sub', card.sub));
    breakingEl.classList.remove('breaking');
    void breakingEl.offsetWidth;         // restart the slide-in for the new headline
    breakingEl.classList.add('breaking');
  }

  /** @param {string} kind 'correct' or 'wrong' @param {string} msg @param {string} why
   *  @param {boolean} ack whether the student has to tap to continue
   *  @param {string[]} [chips] the consequence read-out from chipsFor */
  function paintSheet(kind, msg, why, ack, chips) {
    sheetMsg.textContent = msg;
    sheetChips.textContent = '';
    (chips || []).forEach(function (text) {
      var dir = text.indexOf('▲') >= 0 ? 'up' : text.indexOf('▼') >= 0 ? 'down' : 'flat';
      sheetChips.appendChild(chip('tag chip-' + dir, text));
    });
    sheetChips.hidden = !(chips && chips.length);
    sheetWhy.textContent = why;
    sheetBtn.style.display = ack ? '' : 'none';
    sheet.className = 'sheet ' + kind + ' open';
  }

  /** The boss's entrance: a stamp slams over the graph and leaves. @param {string} text */
  function slamStamp(text) {
    stampText.textContent = text;
    stampText.classList.remove('slam');
    stampMount.hidden = false;
    void stampText.offsetWidth;          // restart the slam on a stamp that is already mounted
    stampText.classList.add('slam');
    Arcade.sfx.play('stamp');
    setTimeout(function () { stampMount.hidden = true; }, 700);
  }

  // The sheet is `position: fixed` below the viewport when it is closed, so a button left displayed
  // inside it stays tabbable off screen for the rest of the session: a keyboard user on the level
  // list tabs into a control they cannot see or scroll to.
  function hideSheet() { sheet.classList.remove('open'); sheetBtn.style.display = 'none'; }

  /** @type {(() => void)|null} */ var ackResolve = null;
  function ackNow() {
    if (!ackResolve) return;
    var resolve = ackResolve;
    ackResolve = null;
    resolve();
  }
  sheetBtn.addEventListener('click', function () { hideSheet(); ackNow(); });

  /** The WHY beat: it stays up until the student taps the button.
   *  @param {string} msg @param {string} why @param {string} [label] default "Got it"
   *  @param {string} [kind] 'wrong' (default) or 'correct' — the sprint marks right answers here too
   *  @returns {Promise<void>} */
  function sheetAsk(msg, why, label, kind, chips) {
    ackNow();
    sheetBtn.textContent = label || 'Got it';
    paintSheet(kind || 'wrong', msg, why, true, chips);
    return new Promise(function (resolve) { ackResolve = resolve; });
  }

  /** @param {string} msg @returns {Promise<void>} the 450 ms tick of approval */
  function sheetFlash(msg) {
    paintSheet('correct', msg, '', false);
    return wait(450).then(hideSheet);
  }

  /** The WHY beat on a right answer: the rubric sentence and the read-out, up through the
   *  consequence and a moment after, with no button to press. Right answers used to get a 450 ms
   *  tick and no sentence at all, which halved the rubric practice a run gives.
   *  @param {string} msg @param {string} why @param {string[]} [chips] */
  function sheetShow(msg, why, chips) { paintSheet('correct', msg, why, false, chips); }

  /** A moment to read, or a tap anywhere to move on. @param {number} ms @returns {Promise<void>} */
  function readBeat(ms) {
    return new Promise(function (resolve) {
      var timer = setTimeout(done, ms);
      function done() { clearTimeout(timer); document.removeEventListener('pointerdown', done); resolve(); }
      document.addEventListener('pointerdown', done);
    });
  }

  /** The consequence, with the sheet already up: the animation plays, then the reading beat —
   *  unless the tap that skipped the animation has already said "seen it".
   *  @param {any} card @returns {Promise<void>} */
  function playConsequence(card) {
    var skipped = false;
    function onSkip() { skipped = true; }
    graph.on('skip', onSkip);
    return graph.animateTo(card.result).then(function () {
      graph.off('skip', onSkip);
      return skipped ? undefined : readBeat(WHY_MS);
    });
  }

  /** The clock a practice or tutorial round runs on: it never starts, never ends and never paints,
   *  so a round of the untimed kind waits for a real release and nothing else. It answers every call
   *  a timerBar answers, which is what lets roundClock and gapClock keep one code path each.
   *  @param {number} ms what a full bar would have been @returns {any} */
  function idleClock(ms) {
    return {
      start: function () { }, stop: function () { }, pause: function () { }, resume: function () { },
      remaining: function () { return ms; }, extend: function () { }
    };
  }

  /** The round clock wired to the graph's release stream. `next()` resolves with the student's next
   *  release, or null once the clock runs out. A drag still in flight at zero buys one extension, so
   *  the answer already under the finger is never stolen; one clock serves all of a boss's moves.
   *  @param {number} ms @param {{untimed?:boolean}} [opts] `untimed` never runs out: practice and
   *    the tutorial @returns {any} */
  function roundClock(ms, opts) {
    var untimed = !!(opts && opts.untimed);
    var expired = false, dragging = false, extended = false;
    /** @type {((value:any) => void)|null} */ var waiting = null;
    /** @type {any} */ var startHandle = null;   // the slide-in beat, before the clock is running
    var waitingToStart = false;                  // …and the same beat, paused by the ? button
    var timer = untimed ? idleClock(ms) : Arcade.timerBar(timerEl, ms, {
      warnAt: WARN_MS, onEnd: atZero, onTick: function (left) { if (left <= 0) atZero(); }
    });

    /** @param {any} value */
    function handOver(value) {
      if (!waiting) return;
      var resolve = waiting;
      waiting = null;
      resolve(value);
    }
    function atZero() {
      if (expired) return;
      // A drag in flight at zero buys the one extension, so the answer under the finger is never
      // stolen. It buys exactly one: reaching zero a second time expires the round whether or not
      // a finger is still down, or holding a curve would be unlimited thinking time.
      if (dragging && !extended) { extended = true; timer.extend(EXTEND_MS); timer.resume(); return; }
      expired = true;
      timer.stop();
      handOver(null);
    }
    function onDragStart() { dragging = true; }
    /** @param {any} payload */
    function onRelease(payload) {
      dragging = false;
      // A tap with no drag is not an answer. The gesture is "tap the curve you think moves, then
      // drag it": the tap alone only lights the curve, and the engine has already sprung it back.
      // Costing a heart for it would punish the first half of the gesture the game asked for. The
      // clock is untouched, so it is not free thinking time either — the round waits for a real
      // release or the timeout. Bosses take their releases from here too, so they agree.
      if (payload && payload.kind === 'none') return;
      if (!expired) handOver(payload);
    }
    graph.on('dragstart', onDragStart);
    graph.on('release', onRelease);

    // The clock does not start until the headline has finished sliding in. The bar sits full and
    // stopped for those 300 ms, so the round never opens with "the clock started before I saw the
    // words" — and an answer given inside the beat still reads a full bar, i.e. a full speed bonus.
    // The graph is already live and both listeners are already attached, so nothing is dropped.
    function armStart() {
      if (CARD_IN_MS > 0 && typeof setTimeout === 'function') {
        startHandle = setTimeout(function () { startHandle = null; timer.start(); }, CARD_IN_MS);
      } else {
        timer.start();
      }
    }
    /** @returns {boolean} true if a not-yet-started clock was the thing that got halted */
    function disarmStart() {
      if (!startHandle) return false;
      clearTimeout(startHandle);
      startHandle = null;
      return true;
    }
    armStart();

    return {
      /** @returns {Promise<any>} */
      next: function () {
        return expired ? Promise.resolve(null) : new Promise(function (resolve) { waiting = resolve; });
      },
      // Never more than there was when the clock first hit zero. A round rescued by the
      // hold-past-zero extension had 0 ms left at that moment, so it scores no speed bonus: the
      // extension buys the answer under the finger, not the points for having been quick.
      remaining: function () { return extended ? 0 : timer.remaining(); },
      pause: function () { if (disarmStart()) { waitingToStart = true; return; } timer.pause(); },
      resume: function () {
        if (expired) return;
        if (waitingToStart) { waitingToStart = false; armStart(); return; }
        timer.resume();
      },
      stop: function () {
        expired = true;
        disarmStart();
        timer.stop();
        graph.off('dragstart', onDragStart);
        graph.off('release', onRelease);
        handOver(null);
      }
    };
  }

  /** The clock the gap tap runs on. `answer` resolves with the graph's `gap` payload, or null when
   *  the clock wins; `stop()` ends it as a timeout, which is also how a quit unwinds it.
   *  @param {number} ms @param {{untimed?:boolean}} [opts] `untimed` never runs out: practice
   *  @returns {{answer:Promise<any>, stop:() => void}} */
  function gapClock(ms, opts) {
    /** @type {(value:any) => void} */ var settle = function () { };
    var answer = new Promise(function (resolve) { settle = resolve; });
    var done = false;
    var timer = opts && opts.untimed
      ? idleClock(ms)
      : Arcade.timerBar(timerEl, ms, { warnAt: WARN_MS, onEnd: function () { finish(null); } });
    /** @param {any} value */
    function finish(value) {
      if (done) return;
      done = true;
      timer.stop();
      graph.off('gap', finish);
      settle(value);
    }
    graph.on('gap', finish);
    timer.start();
    return {
      answer: answer,
      pause: function () { if (!done) timer.pause(); },
      resume: function () { if (!done) timer.resume(); },
      stop: function () { finish(null); }
    };
  }

  /** HOW TO PLAY is allowed to be opened mid-round, and reading the rules is not a speed test. */
  function pauseClocks() {
    if (run && run.clock) run.clock.pause();
    if (run && run.gapClock) run.gapClock.pause();
    if (exam && exam.pause) exam.pause();
  }
  function resumeClocks() {
    if (run && run.clock) run.clock.resume();
    if (run && run.gapClock) run.gapClock.resume();
    if (exam && exam.resume) exam.resume();
  }

  /** Everything a wrong answer costs, before the WHY line. Practice keeps the shake and the broken
   *  streak — the answer was still wrong — but has no hearts to lose. */
  function punish() {
    Arcade.shake(graphWrap);
    Object.keys(graph.gauges).forEach(function (id) { graph.gauges[id].flash('red'); });
    if (!run.practice) run.hearts.lose();
    run.streak.miss();
  }

  /** @param {number} points */
  function award(points) {
    run.score += points;
    scoreEl.textContent = String(run.score);
  }

  /** The speed bonus, with a reading grace. Flat at the cap for the first TIMING.readGrace seconds
   *  of the clock, then straight down to zero at the buzzer.
   *
   *  Linear in time remaining — what this used to be — paid students not to read: a careful reader
   *  who was right scored below a fast guesser who was right, 600 against 750 on the same correct
   *  answer at a ×5 streak. And it got worse as the clocks got longer, because a bigger window is a
   *  bigger penalty for using it. Now the reading beat is free and only the race is scored.
   *  @param {number} left ms on the clock @param {number} total @param {number} cap
   *  @returns {number} the speed bonus, banked for the end screen */
  function speedBonus(left, total, cap) {
    if (run.practice) return 0;         // no clock, so nothing to be quick against
    var window = total - GRACE_MS;      // the part of the clock the bonus actually decays across
    var frac = window > 0
      ? Math.min(1, Math.max(0, left / window))
      : (left > 0 ? 1 : 0);             // a grace longer than the clock: the whole round is grace
    var bonus = Math.round(cap * frac);
    run.speedTotal += bonus;
    return bonus;
  }

  /* ===== KEYBOARD ANSWERS — the same releases a drag makes, from a row of real buttons =====
     The graph is a hit plane and three svg rects: a Chromebook driven by keyboard, or any student
     on a screen reader, could reach every menu in the game and answer not one card. These buttons
     call straight into the engine, which springs the curve exactly where a drag would have snapped
     it and emits the identical `release` payload, so nothing downstream can tell them apart. */

  /** @type {any} */ var kbdGap = null;

  /** @param {string} label @param {string} aria @param {() => void} onClick @returns {any} */
  function kbdBtn(label, aria, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-ghost';
    b.textContent = label;
    b.setAttribute('aria-label', aria);
    b.addEventListener('click', onClick);
    return b;
  }

  /** One pair of buttons per curve this level lets the student touch, plus the movement-along pair
   *  on the levels whose pool hides trick cards. @param {any} L */
  function buildKbdRow(L) {
    showKbdGap(false);
    kbdRow.textContent = '';
    L.draggable.forEach(function (curve) {
      var label = curveLabel(curve);
      kbdRow.appendChild(kbdBtn(label + ' ←', label + ' shifts left', function () { graph.answer('shift', curve, 'L'); }));
      kbdRow.appendChild(kbdBtn(label + ' →', label + ' shifts right', function () { graph.answer('shift', curve, 'R'); }));
    });
    if (L.pool.some(function (card) { return card.kind === 'move'; })) {
      var along = L.draggable[0];
      kbdRow.appendChild(kbdBtn('along ↑', 'Movement along the curve, up', function () { graph.answer('move', along, 'up'); }));
      kbdRow.appendChild(kbdBtn('along ↓', 'Movement along the curve, down', function () { graph.answer('move', along, 'down'); }));
    }
  }

  /** The three gap buttons, up only while the graph is asking. @param {boolean} on */
  function showKbdGap(on) {
    if (kbdGap) {
      var hadFocus = kbdGap.contains(document.activeElement);
      if (kbdGap.parentNode) kbdGap.parentNode.removeChild(kbdGap);
      kbdGap = null;
      // Do not drop a keyboard user out of the row just because the beat ended under them.
      if (hadFocus && kbdRow.firstChild) kbdRow.firstChild.focus();
    }
    if (!on) return;
    kbdGap = document.createElement('span');
    kbdGap.className = 'row wrap';
    [['left of Yf', 'recessionary', 'Recessionary gap, left of the full-employment line'],
      ['on Yf', 'none', 'No gap: output is at full employment'],
      ['right of Yf', 'inflationary', 'Inflationary gap, right of the full-employment line']
    ].forEach(function (entry) {
      kbdGap.appendChild(kbdBtn(entry[0], entry[2], function () { graph.answerGap(entry[1]); }));
    });
    kbdRow.appendChild(kbdGap);
  }

  /* ===== HOW TO PLAY — shown once per level, and from every ? button =====
     Opened from the play screen it pauses the round clock, because reading the rules is not a
     speed test; the demo above the cards is the one thing a still card cannot show. */

  /** What the "Got it" button does, and what ← does — which are not always the same thing: the
   *  rules shown automatically on the way into a level go on into the level, but backing out of
   *  them cancels the level instead of starting it. */
  /** @type {(() => void)|null} */ var howtoAfter = null;
  /** @type {(() => void)|null} */ var howtoBackTo = null;
  /** @type {any} */ var demo = null;
  var demoTimer = 0, demoOn = false, demoRight = true;

  /** @param {number} n @returns {boolean} */
  function howtoSeen(n) {
    var saved = Arcade.store.get('arcade.shift.howto', null);
    var seen = saved && Array.isArray(saved.seen) ? saved.seen : [];
    return seen.indexOf(n) >= 0;
  }

  /** @param {number} n */
  function markHowtoSeen(n) {
    var saved = Arcade.store.get('arcade.shift.howto', null);
    var seen = saved && Array.isArray(saved.seen)
      ? saved.seen.filter(function (v) { return typeof v === 'number'; })
      : [];
    if (seen.indexOf(n) < 0) seen.push(n);
    Arcade.store.set('arcade.shift.howto', { seen: seen });
  }

  function runDemo() {
    if (!demoOn || !demo) return;
    demo.animateTo({ shifts: { AD: demoRight ? 12 : 0 } }).then(function () {
      demoRight = !demoRight;
      if (!demoOn) return;
      demoTimer = setTimeout(runDemo, 700);
    });
  }

  function startDemo() {
    if (!demo) {
      demo = ArcadeGraph.create(howtoDemoEl, { market: 'adas', show: { LRAS: false } });
      demo.lock();                       // it is a picture that moves, not a second board to play
    }
    demoOn = true;
    demoRight = true;
    runDemo();
  }

  function stopDemo() {
    demoOn = false;
    if (demoTimer) { clearTimeout(demoTimer); demoTimer = 0; }
  }

  /** @param {number} level the level being started, or 0 for every card */
  function paintHowto(level) {
    howtoTitle.textContent = level ? 'How to play · Level ' + level : 'How to play';
    howtoCards.textContent = '';
    HOWTO.forEach(function (card) {
      if (level && card.levels && card.levels.indexOf(level) < 0) return;
      var panel = document.createElement('div');
      panel.className = 'panel howto-card';
      var emoji = fill('howto-emoji', card.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      panel.appendChild(emoji);
      var body = fill('', '');
      var head = fill('howto-head', card.head + ' ');
      if (card.levels) head.appendChild(chip('tag', 'Level ' + card.levels.join(' & ')));
      body.appendChild(head);
      body.appendChild(fill('howto-body', card.body));
      panel.appendChild(body);
      howtoCards.appendChild(panel);
    });
  }

  /** @param {number} level @param {() => void} after what "Got it" does
   *  @param {() => void} [back] what ← does; the same thing unless it is given */
  function openHowto(level, after, back) {
    howtoAfter = after;
    howtoBackTo = back || after;
    paintHowto(level);
    show('howto');
    startDemo();
  }

  /** @param {boolean} [backwards] true when ← was the way out */
  function closeHowto(backwards) {
    stopDemo();
    var go = backwards === true ? howtoBackTo : howtoAfter;
    howtoAfter = null;
    howtoBackTo = null;
    if (go) go();
  }

  /* ===== MODES — a real run, practice, or the tutorial =====
     Practice is the level with the stakes taken out: no bar, no hearts, no speed bonus, and nothing
     written to storage but arcade.mastery — the readiness map is the one thing a teacher reads, and
     the students most afraid of the clock were contributing nothing to it. The tutorial is the same
     board for one card, once, on the way into Level 1. */

  /** @returns {boolean} */
  function practiceOn() {
    var saved = Arcade.store.get('arcade.shift.practice', null);
    return !!(saved && saved.on);
  }

  /** @param {boolean} on */
  function setPractice(on) {
    Arcade.store.set('arcade.shift.practice', { on: !!on });
    paintPractice();
  }

  function paintPractice() {
    practiceBtn.setAttribute('aria-pressed', practiceOn() ? 'true' : 'false');
  }

  /** What the play screen's chrome shows: the hearts and the bar, or a tag saying why there are none.
   *  @param {string} mode 'play' | 'practice' | 'tutorial' */
  function setMode(mode) {
    var timed = mode === 'play';
    heartsEl.hidden = !timed;
    timerEl.hidden = !timed;
    modeTag.hidden = timed;
    modeTag.textContent = mode === 'practice' ? 'Practice' : mode === 'drill' ? 'Drill' : 'Tutorial';
  }

  /** A hit on the streak, and the call-out when it reaches a new multiplier. */
  function streakUp() {
    run.streak.hit();
    run.bestStreak = Math.max(run.bestStreak, run.streak.count);
    var line = JUICE.streak[run.streak.count];
    if (line) Arcade.toast(line, 1400);
  }

  /** Remember a miss once, so the end screen can hand the card back as a drill. @param {any} card */
  function noteMiss(card) { if (run.missed.indexOf(card) < 0) run.missed.push(card); }

  /** The title screen's "what is this game?" panel, painted from INTRO. */
  function paintIntro() {
    introEl.textContent = '';
    var title = fill('intro-title', 'What is this game?');
    title.id = 'introTitle';
    introEl.appendChild(title);
    INTRO.forEach(function (line) {
      var row = fill('intro-line', '');
      var emoji = fill('intro-emoji', line.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      row.appendChild(emoji);
      row.appendChild(fill('intro-text', line.text));
      introEl.appendChild(row);
    });
  }

  /* ===== TUTORIAL — one headline, no clock, no hearts, before the first real card =====
     The rules screen says "drag the curve that moves"; this is where a student finds out what that
     feels like under a finger, with nothing at stake: one card, the level's own graph, the right
     curve breathing until it is grabbed. A miss gets the WHY and another go; a second miss gets a
     ghost drag — the answer plays itself, springs back, and hands the gesture over. Nothing here is
     tracked: a card a student may retry until it is right is a lesson, not a measurement. */

  /** @returns {boolean} */
  function tutorialDone() {
    var saved = Arcade.store.get('arcade.shift.tutorial', null);
    return !!(saved && saved.done);
  }

  /** @param {any} L Level 1 @param {number} token @returns {Promise<void>} */
  async function playTutorial(L, token) {
    var card = null;
    L.pool.forEach(function (c) { if (c.id === TUTORIAL.cardId) card = c; });
    if (!card) return;
    setMode('tutorial');
    graph.setCard({ start: card.start, draggable: L.draggable, dotGrab: L.dotGrab });
    paintCard(card, null, 'Tutorial · no clock');
    hintEl.textContent = TUTORIAL.hint;
    graph.highlight(card.curve, true);
    Arcade.sfx.play('card');
    if (Arcade.voice.enabled) Arcade.say(card.head, { who: 'anchor' });

    var misses = 0;
    while (true) {
      run.clock = roundClock(0, { untimed: true });   // abortRun stops it, which resolves it null
      var ans = await run.clock.next();
      if (!alive(token)) return;
      run.clock.stop();
      graph.lock();
      if (judge(ans, card)) break;
      misses += 1;
      Arcade.sfx.play('snap');
      Arcade.sfx.play('wrong');
      await graph.snapBack({ jolt: true });
      if (!alive(token)) return;
      if (misses < 2) {
        await sheetAsk('✗ ' + truthOf(card), TUTORIAL.miss, 'Try again');
      } else {
        await graph.animateTo(card.result);         // the ghost drag: the answer, then back again
        if (!alive(token)) return;
        await wait(600);
        if (!alive(token)) return;
        await graph.snapBack();
        if (!alive(token)) return;
        await sheetAsk('Like that', TUTORIAL.show, 'Now you try');
      }
      if (!alive(token)) return;
      hideSheet();
      graph.unlock();
    }

    graph.highlight(card.curve, false);
    Arcade.sfx.play('correct');
    await sheetFlash('✓ ' + truthOf(card));
    await graph.animateTo(card.result);
    if (!alive(token)) return;
    await sheetAsk('✓ ' + truthOf(card), card.why + ' ' + TUTORIAL.done, 'Start Level 1', 'correct');
    if (!alive(token)) return;
    hideSheet();
    Arcade.store.set('arcade.shift.tutorial', { done: true });
  }

  /* ===== ROUND LOOP ===== */

  /** The Level 3 beat: once the consequence has played, name the gap it left behind. Five seconds,
   *  50 points times the multiplier, its own Arcade.track at skill 2 (Interpretation), and it counts
   *  toward the run's accuracy like any other scored answer.
   *  @param {any} card @param {number} token @returns {Promise<void>} */
  async function playGap(card, token) {
    var truth = gapNow();
    hintEl.textContent = 'Tap the gap — left of Yf, right of Yf, or the line itself';
    graph.askGap();
    showKbdGap(true);
    run.gapClock = gapClock(GAP_MS, { untimed: run.practice });
    var ans = await run.gapClock.answer;
    if (!alive(token)) return;
    var ok = !!ans && ans.answer === truth;
    graph.markGap(ok);
    run.asked += 1;
    // Tracked the moment it is judged, not after the sheet: quitting during the WHY beat used to
    // drop the answer out of arcade.mastery entirely, and the heat map is the one thing the
    // teacher actually reads.
    Arcade.track(card.ced, 2, ok);
    showKbdGap(false);
    if (ok) {
      Arcade.sfx.play('coin');
      award(Math.round(GAP_POINTS * run.streak.mult));
      streakUp();
      run.correct += 1;
      await sheetFlash('✓ ' + GAP_LABEL[truth]);
    } else {
      Arcade.sfx.play('wrong');
      punish();
      noteMiss(card);
      await sheetAsk('✗ ' + GAP_LABEL[truth], GAP_WHY[truth]);
    }
    if (!alive(token)) return;
    hideSheet();
  }

  /** One card: the headline, the clock, the drag, the verdict, and always the true consequence.
   *  @param {any} card @param {any} L @param {number} token @returns {Promise<void>} */
  async function playRound(card, L, token) {
    graph.setCard({ start: card.start, draggable: L.draggable, dotGrab: L.dotGrab });
    paintCard(card, null);
    hintEl.textContent = L.hint;
    Arcade.sfx.play('card');
    if (Arcade.voice.enabled) Arcade.say(card.head, { who: 'anchor' });

    run.clock = roundClock(L.time, { untimed: run.practice });
    var ans = await run.clock.next();
    if (!alive(token)) return;
    var left = run.clock.remaining();
    run.clock.stop();
    graph.lock();

    var ok = judge(ans, card);
    run.asked += 1;
    Arcade.track(card.ced, card.skill, ok);   // before the sheet and the consequence; see playGap
    var chips = chipsFor(card, L.market);
    if (ok) {
      Arcade.sfx.play('correct');
      award(Math.round((100 + speedBonus(left, L.time, 50)) * run.streak.mult));
      streakUp();
      run.correct += 1;
      sheetShow('✓ ' + truthOf(card), card.why, chips);   // stays up through the consequence
      await playConsequence(card);
    } else {
      Arcade.sfx.play('snap');
      Arcade.sfx.play('wrong');
      await graph.snapBack({ jolt: true });
      if (!alive(token)) return;
      punish();
      noteMiss(card);
      await sheetAsk('✗ ' + truthOf(card), card.why, undefined, undefined, chips);
      if (!alive(token)) return;
      hideSheet();
      await graph.animateTo(card.result);        // ~1.2 s of true consequence; a tap skips it
    }
    if (!alive(token)) return;
    hideSheet();
    if (card.gap) await playGap(card, token);    // trick cards carry no gap, so they never ask
  }

  /* ===== BOSS — every move on one clock, in order or in either order ===== */

  /** The move an answer solved. A boss that insists on an order only ever offers its next move.
   *  @param {any} card @param {boolean[]} done @param {any} ans @returns {number} the index, or -1 */
  function matchMove(card, done, ans) {
    for (var i = 0; i < card.moves.length; i += 1) {
      if (done[i]) continue;
      if (judge(ans, card.moves[i])) return i;
      if (!card.anyOrder) return -1;
    }
    return -1;
  }

  /** Which move a wrong answer was aimed at, so the WHY it earns is the one it needed: the unsolved
   *  move on the curve the student actually touched, else the first still open.
   *  @param {any} card @param {boolean[]} done @param {any} ans @returns {any} */
  function aimedAt(card, done, ans) {
    var first = null;
    for (var i = 0; i < card.moves.length; i += 1) {
      if (done[i]) continue;
      if (!first) first = card.moves[i];
      if (ans && ans.curve && ans.curve === card.moves[i].curve) return card.moves[i];
    }
    return first;
  }

  /** @param {any} card @param {any} L @param {number} token @returns {Promise<void>} */
  async function playBoss(card, L, token) {
    graph.setCard({ start: card.start, draggable: L.draggable, dotGrab: L.dotGrab });
    hintEl.textContent = card.anyOrder
      ? 'Drag the curve that moves — both headlines, either order'
      : 'Drag the curve that moves — one headline at a time';
    Arcade.sfx.play('boss');
    slamStamp(JUICE.boss);
    if (Arcade.voice.enabled) Arcade.say(card.head, { who: 'anchor' });

    var done = card.moves.map(function () { return false; });
    var frozen = [];                             // the curves already marked green
    var accepted = 0;
    var outOfTime = false;
    var dead = false;                            // the last heart went on a boss move

    paintCard(card, done);                       // painted first: the clock waits on this slide-in
    run.clock = roundClock(card.time, { untimed: run.practice });
    while (accepted < card.moves.length && !outOfTime) {
      var ans = await run.clock.next();
      if (!alive(token)) return;
      if (!ans) { outOfTime = true; break; }
      graph.lock();
      var hit = matchMove(card, done, ans);
      if (hit < 0) {
        var missed = aimedAt(card, done, ans);
        Arcade.sfx.play('snap');
        Arcade.sfx.play('wrong');
        await graph.snapBack({ jolt: true });    // back to where the last accepted move left it
        if (!alive(token)) return;
        punish();
        noteMiss(card);
        run.clock.pause();                       // the WHY beat is not a speed test
        await sheetAsk('✗ ' + truthOf(missed), missed.why);
        if (!alive(token)) return;
        hideSheet();
        // The WHY still plays — that is the move they missed — but a run with no hearts left is over.
        // Solving the rest of the boss for a win fanfare and +300 before LEVEL FAILED is a lie.
        if (run.hearts.get() === 0) { dead = true; break; }
        graph.unlock();
        run.clock.resume();
        continue;
      }
      Arcade.sfx.play('coin');
      graph.accept(card.moves[hit].curve);
      frozen.push(card.moves[hit].curve);
      done[hit] = true;
      accepted += 1;
      streakUp();
      await wait(450);                           // let the green land before the next headline
      if (!alive(token)) return;
      if (accepted < card.moves.length) {
        // Re-base the card where this move left it, so a wrong attempt on the next one snaps back
        // to here and not to the boss's opening state. setCard is the only way to do that and it
        // clears every green, so the solved curves are marked again — all but one the next move has
        // to drag itself, which the game cannot both freeze and ask for (Level 1: AD, then AD).
        var nextCurve = card.moves[firstPending(done)].curve;
        graph.setCard({ start: graph.state().shifts, draggable: L.draggable, dotGrab: L.dotGrab });
        frozen.forEach(function (curve) { if (curve !== nextCurve) graph.accept(curve); });
      }
      paintCard(card, done);
    }

    for (var m = 0; m < card.moves.length; m += 1) {
      Arcade.track(card.ced, card.skill, done[m]);   // exactly once per move, solved or not
      run.asked += 1;
      if (done[m]) run.correct += 1;
    }

    var left = run.clock.remaining();
    run.clock.stop();
    graph.lock();
    if (dead) return;                              // playLevel's hearts check routes straight to FAIL
    var chips = chipsFor(card, L.market);
    if (accepted === card.moves.length) {
      Arcade.sfx.play('win');
      award(Math.round((300 + speedBonus(left, card.time, 100)) * run.streak.mult));
      sheetShow('✓ Boss cleared', card.why, chips);   // the combined outcome, in rubric words
      await playConsequence(card);
    } else {
      noteMiss(card);
      await sheetAsk('✗ Out of time', card.why, undefined, undefined, chips);   // a boss left unfinished still earns its WHY
      if (!alive(token)) return;
      hideSheet();
      await graph.animateTo(card.result);
    }
    if (!alive(token)) return;
    hideSheet();
    if (card.gap) await playGap(card, token);      // Level 3 names the gap both shocks left behind
  }

  /* ===== EXAM SPRINT — three College Board-voiced questions, the only multiple choice in the game.
     It never touches the run score: all it can move is the medal and the "Exam Ready" ribbon. ===== */

  /** One question: the stem, four choices, a 70-second pace bar, then the marking and the WHY.
   *  @param {any} q @param {number} index @param {number} total @param {number} token
   *  @returns {Promise<boolean>} whether it was answered right */
  async function askQuestion(q, index, total, token) {
    examCountEl.textContent = (index + 1) + '/' + total;
    examStemEl.textContent = q.stem;
    examChoicesEl.textContent = '';
    var buttons = q.choices.map(function (text, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-ghost btn-block choice';
      b.textContent = KEYS.charAt(i) + '. ' + text;
      examChoicesEl.appendChild(b);
      return b;
    });

    var picked = await new Promise(function (resolve) {
      var settled = false;
      var timer = Arcade.timerBar(examTimerEl, EXAM_MS, { warnAt: WARN_MS, onEnd: function () { finish(-1); } });
      /** @param {number} i the choice tapped, or -1 when the clock won */
      function finish(i) {
        if (settled) return;
        settled = true;
        timer.stop();
        resolve(i);
      }
      buttons.forEach(function (b, i) { b.addEventListener('click', function () { finish(i); }); });
      exam.stop = function () { finish(-1); };
      // The ? button reaches the sprint's clock through these, the same way it reaches a round's.
      exam.pause = function () { timer.pause(); };
      exam.resume = function () { if (!settled) timer.resume(); };
      timer.start();
    });
    if (!examAlive(token)) return false;

    var ok = picked === q.answer;
    buttons.forEach(function (b, i) {
      b.classList.add('marked');
      if (i === q.answer) b.classList.add('right');
      else if (i === picked) b.classList.add('wrong');
    });
    Arcade.sfx.play(ok ? 'correct' : 'wrong');
    Arcade.track(q.ced, q.skill, ok);
    await sheetAsk(ok ? '✓ Correct' : '✗ ' + KEYS.charAt(q.answer) + ' is the answer', q.why, 'Next', ok ? 'correct' : 'wrong');
    if (!examAlive(token)) return ok;
    hideSheet();
    return ok;
  }

  /** @param {number} n the level whose sprint this is */
  function startExam(n) {
    var L = levelOf(n);
    if (!L || !L.ready || !L.exam || !L.exam.length) return;
    abortRun();
    show('exam');
    runExam(L).catch(function () {
      Arcade.toast('Something went wrong — back to the levels');
      goSelect();
    });
  }

  /** @param {any} L */
  async function runExam(L) {
    examToken += 1;
    var token = examToken;
    exam = { L: L, stop: null };
    examSubEl.textContent = 'Level ' + L.n + ' · ' + L.name;
    hideSheet();
    var right = 0;
    for (var i = 0; i < L.exam.length; i += 1) {
      var ok = await askQuestion(L.exam[i], i, L.exam.length, token);
      if (!examAlive(token)) return;
      if (ok) right += 1;
    }
    examToken += 1;                    // the sprint is over; nothing still awaiting may touch it
    showExamResult(L, right, L.exam.length);
  }

  /** @param {any} L @param {number} right @param {number} total */
  function showExamResult(L, right, total) {
    var beforeTitle = Arcade.titleFor();      // a perfect sprint is worth two points, so it promotes
    var rec = saveExam(L.n, right, total);
    sheetBtn.textContent = 'Got it';
    show('end');
    var panel = Arcade.endScreen(screens.end, {
      title: 'EXAM SPRINT', sub: 'Exam Sprint: ' + right + '/' + total,
      score: rec.best || 0, accuracy: rec.acc || 0,
      medal: rec.medal, stamp: Arcade.stampFor(rec.acc || 0),
      ribbon: rec.examPerfect ? 'Exam Ready' : '',
      stats: [
        { label: 'Level ' + L.n, value: L.name },
        { label: 'Best sprint', value: rec.exam.right + '/' + rec.exam.total }
      ],
      note: rec.medal === 'gold' ? '' : 'Gold needs 95% on the level and 2 of 3 here.',
      buttons: [
        { label: 'Levels', primary: true, onClick: goSelect },
        { label: 'Run it again', onClick: function () { startExam(L.n); } },
        ARCADE_BUTTON
      ]
    });
    showTitle(panel, beforeTitle);
    Arcade.focusScreen(screens.end);     // the panel did not exist when show('end') ran
    if (right === total) Arcade.confetti();
  }

  /* ===== THE RUN ===== */

  /** @param {number} n */
  function startLevel(n) {
    var L = levelOf(n);
    if (!L || !L.ready) return;
    abortRun();
    if (!howtoSeen(n)) {                 // the first run of a level opens on the rules
      // Marked by "Got it", not by arriving: ← means the rules were backed out of unread, and the
      // next start of this level should still open on them.
      openHowto(n, function () { markHowtoSeen(n); beginLevel(L); }, goSelect);
      return;
    }
    beginLevel(L);
  }

  /** @param {any} L a fire-and-forget async loop needs a catch, or a throw inside it becomes an
   *  unhandled rejection: the play screen stays up, locked and clockless, until a reload. */
  function beginLevel(L) {
    show('play');
    playLevel(L).catch(function () {
      Arcade.toast('Something went wrong — back to the levels');
      goSelect();
    });
  }

  /** Replay the cards a run missed with nothing at stake: no clock, no hearts, nothing saved but
   *  the tracker. A failed level used to be a dead end — retry the whole thing or leave — and the
   *  cards that cost the hearts were the last thing a student saw and the first thing they forgot.
   *  @param {any} L @param {any[]} cards */
  function startDrill(L, cards) {
    if (!cards || !cards.length) return;
    abortRun();
    show('play');
    playLevel(L, { drill: cards }).catch(function () {
      Arcade.toast('Something went wrong — back to the levels');
      goSelect();
    });
  }

  /** @param {any} L @param {{drill?:any[]}} [opts] `drill`: play just these cards, untimed */
  async function playLevel(L, opts) {
    var o = opts || {};
    runToken += 1;
    var token = runToken;
    run = {
      L: L, hearts: Arcade.hearts(heartsEl, HEARTS), streak: Arcade.streak(),
      score: 0, asked: 0, correct: 0, bestStreak: 0, speedTotal: 0, clock: null, gapClock: null,
      practice: !!o.drill || practiceOn(), drill: o.drill || null, missed: []
    };
    run.streak.render(comboEl);
    scoreEl.textContent = '0';
    hideSheet();
    mountGraph(L.market);                        // the level's own market, before anything reads it
    buildKbdRow(L);
    if (L.market === 'adas') graph.setVisible('LRAS', !!L.showLRAS);
    graph.setCard({ start: {}, draggable: L.draggable, dotGrab: L.dotGrab });

    // The first time anyone reaches Level 1, one card with nothing at stake comes before the eight.
    if (!run.drill && L.n === 1 && !tutorialDone()) {
      await playTutorial(L, token);
      if (!alive(token)) return;
    }
    setMode(run.drill ? 'drill' : run.practice ? 'practice' : 'play');

    var cards = run.drill ? run.drill.slice() : drawCards(L.pool, ROUNDS);
    for (var i = 0; i < cards.length; i += 1) {
      if (cards[i].kind === 'boss') await playBoss(cards[i], L, token);   // a drill can hold the boss
      else await playRound(cards[i], L, token);
      if (!alive(token)) return;
      if (run.hearts.get() === 0) { showFail(L); return; }
    }
    if (run.drill) { showDrillDone(L); return; }
    await playBoss(L.boss, L, token);
    if (!alive(token)) return;
    if (run.hearts.get() === 0) { showFail(L); return; }
    showClear(L);
  }

  /* ===== END SCREENS ===== */

  /** @returns {number} 0-1 */
  function accuracy() { return run.asked ? run.correct / run.asked : 0; }

  /** @returns {{label:string, value:string}[]} */
  function runStats() {
    return [
      { label: 'Best streak', value: String(run.bestStreak) },
      { label: 'Speed bonus', value: '+' + run.speedTotal }
    ];
  }

  /** The earned title, under the medal, plus the promotion beat when this run moved the player up
   *  a rung. Titles are decoration: nothing here touches a score, a medal or an unlock.
   *  @param {any} panel the endScreen panel @param {any} before titleFor() from before the save */
  function showTitle(panel, before) {
    if (!panel) return;
    var after = Arcade.titleFor();
    var rose = after.rank > before.rank;
    var line = fill('title-chip' + (rose ? ' up' : ''), 'Title: ' + after.name + (rose ? ' · 🎉 New title!' : ''));
    var head = panel.querySelector('.end-head');
    head.parentNode.insertBefore(line, head.nextSibling);
    if (rose) Arcade.sfx.play('coin');
  }

  /** The headlines the run missed, above the buttons, so the drill button has a reason.
   *  @param {any} panel the endScreen panel */
  function showMissed(panel) {
    if (!panel || !run.missed.length) return;
    var list = fill('missed-list', '');
    list.appendChild(chip('muted', 'Missed: '));
    run.missed.forEach(function (card, i) { list.appendChild(chip('missed-head', (i ? ' · ' : '') + card.head)); });
    panel.insertBefore(list, panel.lastElementChild);     // endScreen puts the buttons last
  }

  /** @param {any} L @param {any[]} buttons @returns {any[]} the same buttons, with a drill of the
   *  run's misses in second place when there were any */
  function withDrill(L, buttons) {
    var missed = run.missed.slice();
    if (!missed.length) return buttons;
    var drill = { label: 'Drill the ' + missed.length + ' you missed', variant: 'blue', onClick: function () { startDrill(L, missed); } };
    return [buttons[0], drill].concat(buttons.slice(1));
  }

  /** @param {any} L */
  function showDrillDone(L) {
    var acc = accuracy();
    var again = run.missed.slice();
    runToken += 1;
    Arcade.voice.stop();
    sheetBtn.textContent = 'Got it';
    show('end');
    var buttons = [{ label: 'Play the level', primary: true, onClick: function () { startLevel(L.n); } }];
    if (again.length) buttons.push({ label: 'Drill the ' + again.length + ' still missed', variant: 'blue', onClick: function () { startDrill(L, again); } });
    buttons.push({ label: 'Levels', onClick: goSelect });
    buttons.push(ARCADE_BUTTON);
    var panel = Arcade.endScreen(screens.end, {
      title: again.length ? 'DRILL DONE' : 'ALL CLEARED', sub: 'Level ' + L.n + ' · the cards you missed · no clock, no hearts',
      score: run.score, accuracy: acc, medal: null,
      stats: [{ label: 'Right', value: run.correct + '/' + run.asked }],
      note: again.length ? 'The ones above are still tricky. Once more, or take them into a real run.' : 'Every one of them, right. Take that into a real run.',
      buttons: buttons
    });
    showMissed(panel);
    Arcade.focusScreen(screens.end);
    if (!again.length) Arcade.confetti();
  }

  /** @param {any} L */
  function showClear(L) {
    var acc = accuracy();
    var score = run.score;
    runToken += 1;                       // the run is over; nothing still awaiting may touch it
    Arcade.voice.stop();                 // no headline keeps reading over an end screen
    sheetBtn.textContent = 'Got it';
    if (run.practice) {
      // A practice clear banks nothing: no best, no medal, no unlock, no title — the readiness map
      // was written card by card as it went, and that is all practice is for.
      show('end');
      var practicePanel = Arcade.endScreen(screens.end, {
        title: 'PRACTICE DONE', sub: 'Level ' + L.n + ' · ' + L.name + ' · no clock, no hearts',
        score: score, accuracy: acc, medal: null,
        stats: [
          { label: 'Right', value: run.correct + '/' + run.asked },
          { label: 'Best streak', value: String(run.bestStreak) }
        ],
        note: 'Practice fills your readiness map but saves no score, medal or unlock. Play it for real when the drag feels right.',
        buttons: withDrill(L, [
          { label: 'Play for real', primary: true, onClick: function () { setPractice(false); startLevel(L.n); } },
          { label: 'Levels', onClick: goSelect },
          { label: 'Practice again', onClick: function () { startLevel(L.n); } },
          ARCADE_BUTTON
        ])
      });
      showMissed(practicePanel);
      Arcade.focusScreen(screens.end);
      return;
    }
    var beforeTitle = Arcade.titleFor();      // the rank as it stood before this run was banked
    saveProgress(L.n, score, acc);
    Arcade.saveBest('shift', { score: score, initials: Arcade.initials(), level: L.n });
    var saved = loadProgress();
    var rec = saved.levels[String(L.n)] || {};
    show('end');
    var panel = Arcade.endScreen(screens.end, {
      title: 'LEVEL CLEAR', sub: 'Level ' + L.n + ' · ' + L.name,
      // this run's medal and stamp, not the career best the level tile carries
      score: score, accuracy: acc, stamp: Arcade.stampFor(acc),
      medal: Arcade.medalFor(acc, { examPassed: !!(rec.exam && rec.exam.right >= 2) }),
      stats: runStats(),
      // endScreen renders `note` immediately above the buttons, so the framing sits on the sprint.
      note: EXAM_FRAME + (saved.unlocked > L.n ? '' : ' · Clear 75% to unlock the next level.'),
      buttons: withDrill(L, [
        { label: 'Exam Sprint →', primary: true, variant: 'gold', onClick: function () { startExam(L.n); } },
        { label: 'Levels', onClick: goSelect },
        { label: 'Replay', onClick: function () { startLevel(L.n); } },
        ARCADE_BUTTON
      ])
    });
    showTitle(panel, beforeTitle);
    showMissed(panel);
    Arcade.focusScreen(screens.end);
    Arcade.confetti();
  }

  /** @param {any} L */
  function showFail(L) {
    var acc = accuracy();
    runToken += 1;
    Arcade.voice.stop();
    sheetBtn.textContent = 'Got it';
    show('end');
    var panel = Arcade.endScreen(screens.end, {
      title: 'LEVEL FAILED', sub: 'The economy collapsed. Retry?', tone: 'fail',
      score: run.score, accuracy: acc, medal: null, stamp: Arcade.stampFor(acc),
      stats: runStats(),
      buttons: withDrill(L, [
        { label: 'Retry', primary: true, onClick: function () { startLevel(L.n); } },
        { label: 'Levels', onClick: goSelect },
        ARCADE_BUTTON
      ])
    });
    showMissed(panel);
    Arcade.focusScreen(screens.end);
  }

  function goSelect() {
    abortRun();                          // which is also where the read-aloud voice is stopped
    sheetBtn.textContent = 'Got it';
    paintSelect();
    show('select');
  }

  /** Back to the hub — the other games are one tap from there. Every end screen offers it. */
  function goHome() { window.location.href = '../index.html'; }
  var ARCADE_BUTTON = { label: 'Arcade', onClick: goHome };

  /* ===== BOOT ===== */

  LEVELS.forEach(function (L) {                  // every card's true outcome, computed once at load
    if (!L.ready) return;
    L.market = L.market || 'adas';
    L.time = TIMING.cardSeconds[L.n] * 1000;     // the level's clocks, from the one tunable block
    L.boss.time = TIMING.bossSeconds[L.n] * 1000;
    L.pool.forEach(function (card) { card.result = computeResult(card, L.market); });
    L.boss.result = computeResult(L.boss, L.market);
    // One hint for every card in a level that hides trick cards in its pool, so the hint itself
    // never gives away which kind of card is on screen.
    L.hint = L.pool.some(function (card) { return card.trick; })
      ? 'Drag whatever the headline actually moves'
      : 'Drag the curve that moves';
    // …and one grab radius for the same reason. A wide "dot or nothing" disc over the equilibrium
    // is what a level needs when "movement along the curve" is one of its answers. On a level whose
    // pool has no move card the answer is always a shift, so the same disc would only turn a drag
    // that happened to start near the dot into a movement along — wrong, and a heart.
    var moves = L.pool.some(function (card) { return kindOf(card) === 'move'; })
      || L.boss.moves.some(function (m) { return kindOf(m) === 'move'; });
    L.dotGrab = moves ? 'wide' : 'narrow';
  });

  Arcade.bigType(Arcade.store.get('arcade.bigType', false));
  Arcade.sfx.bindMuteButton(byId('muteBtn'));
  Arcade.voice.bindButton(byId('voiceBtn'));
  Arcade.mountSwitcher({ current: 'shift' });
  sheetBtn.style.display = 'none';
  mountGraph('adas');                            // the AD–AS board is up and locked before any level

  initialsBtn.textContent = Arcade.initials();
  initialsBtn.addEventListener('click', function () {
    if (!initialsPanel.hidden) { initialsPanel.hidden = true; return; }
    initialsPanel.hidden = false;
    Arcade.initialsEntry(initialsMount, {
      onDone: function (value) {
        initialsBtn.textContent = value;
        initialsPanel.hidden = true;
      }
    });
  });

  byId('examPace').textContent = TIMING.examSeconds + ' s';
  paintIntro();
  paintPractice();
  practiceBtn.addEventListener('click', function () { setPractice(!practiceOn()); });

  byId('playBtn').addEventListener('click', goSelect);
  byId('selectBack').addEventListener('click', function () { abortRun(); show('title'); });
  byId('playBack').addEventListener('click', goSelect);
  byId('examBack').addEventListener('click', goSelect);
  byId('howtoBack').addEventListener('click', function () { closeHowto(true); });
  byId('howtoGo').addEventListener('click', function () { closeHowto(false); });
  byId('selectHowto').addEventListener('click', function () {
    openHowto(0, function () { show('select'); });        // no level is being started: show them all
  });
  byId('playHowto').addEventListener('click', function () {
    if (!run) return;
    pauseClocks();
    openHowto(run.L.n, function () { show('play'); resumeClocks(); });
  });
  byId('examHowto').addEventListener('click', function () {
    if (!exam) return;
    pauseClocks();                                        // the sprint's own clock stops too
    openHowto(exam.L.n, function () { show('exam'); resumeClocks(); });
  });

  paintSelect();
  var deepLink = parseInt(String(Arcade.qs('level', '')), 10);
  if (Number.isFinite(deepLink)) {
    if (playable(deepLink)) {
      startLevel(deepLink);
    } else {
      show('select');
      var target = levelOf(deepLink);
      Arcade.toast(target && target.ready ? 'Level ' + deepLink + ' is still locked' : 'Level ' + deepLink + ' is not built yet');
    }
  }
  booted = true;      // whatever the boot did or did not show, the next one is the student's doing
}());
</script>

</body>
</html>
