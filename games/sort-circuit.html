  whySeconds: 1.6,            // how long a right answer's WHY line stays up; a tap ends it
  examSeconds: 70             // the Exam Sprint stays at the real exam's Section I pace
};

/* ================================================================================
   HOW TO PLAY — the cards the first run of a deck opens on, and what the ? shows.
   ================================================================================ */
const HOWTO = [
  { emoji: '\u{1F0CF}', head: 'One card, two bins', body: 'A card lands with a thing on it. Drag it left or right into the bin it belongs in. Let go past the edge and it snaps home; let go early and it comes back.' },
  { emoji: '❤️', head: 'Three hearts, and a streak', body: 'A wrong sort costs a heart, and three lost ends the deck. Three right in a row starts a multiplier that climbs to ×5.' },
  { emoji: '⚡', head: 'The bar is the clock', body: 'It empties while you decide and turns red near the end; out of time counts as wrong. The last four cards come on half the clock, for half again the points.' },
  { emoji: '\u{1F4DD}', head: 'Then the Exam Sprint', body: 'Three questions in the exam’s own voice at the exam’s own pace. Optional — but gold needs it.' }
];

/* ================================================================================
   WHAT IS THIS GAME? — the purpose, before the rules.
   ================================================================================ */
const INTRO = [
  { emoji: '\u{1F500}', text: 'The exam is full of sorting questions in disguise: is this in GDP, is this money, is this expansionary, which account. This is those questions at speed.' },
  { emoji: '\u{1F393}', text: 'Every card you sort gets a WHY line written the way the FRQ wants it, so the fast game and the slow answer train the same reflex.' },
  { emoji: '\u{1F3AE}', text: 'Four decks, twelve cards and a lightning finish each, hearts and a streak. The Exam Sprint at the end is the only multiple choice.' }
];

/* ================================================================================
   JUICE — the streak call-outs, keyed by the run length that earns them, and the lightning round's entrance.
   Copy, not logic.
   ================================================================================ */
const JUICE = {
  streak: { 3: '🔥 Three in a row · ×2', 6: '🔥🔥 Six straight · ×3', 9: '🔥🔥🔥 Nine straight · ×4', 12: '🔥 ×5 · MAXED OUT' },
  lightning: '⚡ LIGHTNING'
};
</script>

<script src="../shared/leaderboard.js?v=20260903d"></script>

<script>
/* ================================================================================
   SORT CIRCUIT — the game. Sections: elements · screens · progress · deck select ·
   the card (drag) · round chrome · round loop · exam sprint · the run · end screens · boot.
   During play the student's only input is dragging the card into a bin; multiple
   choice appears nowhere but the Exam Sprint. Every sort calls Arcade.track once.
   ================================================================================ */
(function () {
  'use strict';
  if (typeof Arcade === 'undefined') return;

  var CARD_MS = TIMING.cardSeconds * 1000;
  var LIGHTNING_MS = TIMING.lightningSeconds * 1000;
  var WARN_MS = TIMING.warnSeconds * 1000;
  var CARD_IN_MS = TIMING.cardInSeconds * 1000;
  var GRACE_MS = TIMING.readGrace * 1000;
  var WHY_MS = TIMING.whySeconds * 1000;
  var EXAM_MS = TIMING.examSeconds * 1000;
  var HEARTS = 3;
  var ROUNDS = 12;            // cards drawn before the lightning finish
  var LIGHTNING = 4;          // cards in the finish
  var COMMIT = 0.38;          // how far across the table (as a fraction of its width) a drag must go
  var KEYS = 'ABCD';
  var EXAM_DRAW = 3;          // questions per sprint, drawn from the level's pool
  var EXAM_FRAME = 'Now say it the way the exam asks — 3 questions, ' + TIMING.examSeconds + ' s each';

  /* ===== ELEMENTS ===== */

  /** @param {string} id @returns {any} */
  function byId(id) { return document.getElementById(id); }
  /** @param {number} ms @returns {Promise<void>} */
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  /** @param {string} cls @param {string} text @returns {any} */
  function fill(cls, text) { var n = document.createElement('div'); n.className = cls; n.textContent = text; return n; }
  /** @param {string} cls @param {string} text @returns {any} */
  function chip(cls, text) { var n = document.createElement('span'); n.className = cls; n.textContent = text; return n; }

  var screens = {
    title: byId('screen-title'), select: byId('screen-select'), howto: byId('screen-howto'),
    play: byId('screen-play'), exam: byId('screen-exam'), end: byId('screen-end')
  };
  var deckList = byId('deckList');
  var initialsBtn = byId('initialsBtn'), initialsPanel = byId('initialsPanel'), initialsMount = byId('initialsMount');
  var heartsEl = byId('hearts'), comboEl = byId('combo'), scoreEl = byId('score'), timerEl = byId('timer');
  var deckTag = byId('deckTag'), cardCount = byId('cardCount');
  var table = byId('sortTable'), binLeft = byId('binLeft'), binRight = byId('binRight');
  var binLeftLabel = byId('binLeftLabel'), binRightLabel = byId('binRightLabel');
  var cardEl = byId('sortCard'), cardEmoji = byId('cardEmoji'), cardText = byId('cardText');
  var hintEl = byId('hint'), kbdRow = byId('kbdRow'), cardRead = byId('cardRead');
  var examTimerEl = byId('examTimer'), examCountEl = byId('examCount'), examSubEl = byId('examSub');
  var examStemEl = byId('examStem'), examChoicesEl = byId('examChoices');
  var sheet = byId('sheet'), sheetMsg = byId('sheetMsg'), sheetWhy = byId('sheetWhy'), sheetBtn = byId('sheetBtn');
  var howtoTitle = byId('howtoTitle'), howtoCards = byId('howtoCards'), introEl = byId('intro');

  /** The run in progress. `token` is what tells an awaiting round it has been abandoned. */
  var run = null;
  var runToken = 0;
  var exam = null;
  var examToken = 0;
  /** @param {number} token @returns {boolean} */
  function alive(token) { return token === runToken; }
  /** @param {number} token @returns {boolean} */
  function examAlive(token) { return token === examToken; }

  /* ===== SCREENS ===== */

  var booted = false;
  /** @param {string} name */
  function show(name) {
    Object.keys(screens).forEach(function (key) { screens[key].classList.toggle('active', key === name); });
    if (booted) Arcade.guardTaps();
    booted = true;
    Arcade.focusScreen(screens[name]);
  }

  function abortRun() {
    runToken += 1;
    examToken += 1;
    if (run && run.clock) run.clock.stop();
    if (exam && exam.stop) exam.stop();
    ackNow();
    hideSheet();
    settleDrag(null);
    Arcade.voice.stop();
  }

  /* ===== PROGRESS — arcade.sort.progress ===== */

  /** @returns {{unlocked:number, levels:Object<string, any>}} */
  function loadProgress() {
    var p = Arcade.store.get('arcade.sort.progress', null);
    if (!p || typeof p !== 'object') p = {};
    var levels = {};
    var raw = p.levels && typeof p.levels === 'object' ? p.levels : {};
    Object.keys(raw).forEach(function (key) { if (raw[key] && typeof raw[key] === 'object') levels[key] = raw[key]; });
    return { unlocked: typeof p.unlocked === 'number' && p.unlocked >= 1 ? p.unlocked : 1, levels: levels };
  }

  /** @returns {any} */
  function blankRecord() { return { cleared: false, acc: 0, best: 0, medal: null, exam: null, examPerfect: false }; }

  /** @param {any} rec @returns {any} */
  function rescore(rec) {
    rec.medal = Arcade.medalFor(rec.acc, { examPassed: !!(rec.exam && rec.exam.right >= 2) });
    rec.examPerfect = !!(rec.exam && rec.exam.total > 0 && rec.exam.right === rec.exam.total && rec.acc >= 0.95);
    return rec;
  }

  /** @param {number} n @param {number} score @param {number} acc */
  function saveProgress(n, score, acc) {
    var p = loadProgress();
    var rec = p.levels[String(n)] || blankRecord();
    rec.cleared = true;
    rec.acc = Math.max(rec.acc || 0, acc);
    rec.best = Math.max(rec.best || 0, score);
    p.levels[String(n)] = rescore(rec);
    if (rec.acc >= 0.75) p.unlocked = Math.max(p.unlocked, n + 1);
    Arcade.store.set('arcade.sort.progress', p);
  }

  /** @param {number} n @param {number} right @param {number} total @returns {any} */
  function saveExam(n, right, total) {
    var p = loadProgress();
    var rec = p.levels[String(n)] || blankRecord();
    if (!rec.exam || right > rec.exam.right) rec.exam = { right: right, total: total };
    p.levels[String(n)] = rescore(rec);
    Arcade.store.set('arcade.sort.progress', p);
    return rec;
  }

  /* ===== DECK SELECT ===== */

  /** @param {number} n @returns {any} */
  function deckOf(n) { for (var i = 0; i < DECKS.length; i += 1) if (DECKS[i].n === n) return DECKS[i]; return undefined; }
  /** @param {number} n @returns {boolean} */
  function playable(n) { return !!deckOf(n) && n <= loadProgress().unlocked; }

  /** @param {any} D @param {any} rec @param {boolean} locked @returns {any} */
  function deckTile(D, rec, locked) {
    var tile = document.createElement('div');
    tile.className = 'panel level-tile' + (locked ? ' locked' : '');
    var medal = Arcade.safeMedal(rec && rec.medal);
    var open = document.createElement('button');
    open.type = 'button';
    open.className = 'tile-open';
    open.disabled = locked;
    open.setAttribute('aria-label', (locked ? 'Locked: deck ' : 'Play deck ') + D.n + ', ' + D.name + (medal === 'none' ? '' : ', ' + medal + ' medal'));
    open.appendChild(chip('level-num', String(D.n)));
    var info = chip('tile-info', '');
    info.appendChild(chip('tile-name', D.name + (locked ? ' 🔒' : '')));
    var meta = chip('tile-meta', '');
    meta.appendChild(chip('muted', rec && rec.cleared ? 'Best ' + rec.best + ' · ' + Math.round(rec.acc * 100) + '%' : locked ? 'Locked' : D.blurb));
    if (rec && rec.exam) meta.appendChild(chip('tag', 'Sprint ' + rec.exam.right + '/' + rec.exam.total));
    if (rec && rec.examPerfect) meta.appendChild(chip('ribbon', 'Exam Ready'));
    info.appendChild(meta);
    open.appendChild(info);
    open.appendChild(chip('medal ' + medal, medal === 'none' ? '—' : medal.charAt(0).toUpperCase()));
    if (!locked) open.addEventListener('click', function () { startDeck(D.n); });
    tile.appendChild(open);
    if (rec && rec.cleared) {
      var sprint = document.createElement('button');
      sprint.type = 'button';
      sprint.className = 'btn btn-ghost tile-btn';
      sprint.textContent = 'Exam Sprint';
      sprint.setAttribute('aria-label', 'Exam Sprint for deck ' + D.n);
      sprint.addEventListener('click', function () { startExam(D.n); });
      tile.appendChild(sprint);
    }
    return tile;
  }

  function paintSelect() {
    var progress = loadProgress();
    deckList.textContent = '';
    DECKS.forEach(function (D) { deckList.appendChild(deckTile(D, progress.levels[String(D.n)] || null, D.n > progress.unlocked)); });
  }

  /* ===== THE CARD — one pointer, one axis, two bins =====
     The card follows the finger sideways and tilts a little; past COMMIT of the table's width
     it is released into that bin, otherwise it springs home. A tap with no drag does nothing.
     The keyboard gets the same answer through two real buttons. */

  /** @type {any} */ var drag = null;
  /** @type {((bin:number|null) => void)|null} */ var dragResolve = null;
  var cardLocked = true;

  /** @returns {number} */
  function tableWidth() { return Math.max(1, table.getBoundingClientRect().width); }

  /** @param {number} dx px @param {boolean} animate */
  function placeCard(dx, animate) {
    cardEl.style.transition = animate ? 'transform .18s ease-out' : 'none';
    cardEl.style.transform = 'translateX(' + dx.toFixed(1) + 'px) rotate(' + (dx / tableWidth() * 14).toFixed(2) + 'deg)';
    var lean = dx / (tableWidth() * COMMIT);
    binLeft.classList.toggle('near', lean < -0.5);
    binRight.classList.toggle('near', lean > 0.5);
  }

  /** Finish whatever drag is in flight without a verdict. @param {any} ev */
  function settleDrag(ev) {
    if (!drag) return;
    var d = drag;
    drag = null;
    try { cardEl.releasePointerCapture(d.pointerId); } catch (err) { /* already gone */ }
    if (ev) placeCard(0, true);
  }

  /** The next sort: resolves with 0 (left), 1 (right), or null when the clock wins.
   *  @returns {Promise<number|null>} */
  function nextSort() {
    return new Promise(function (resolve) { dragResolve = resolve; });
  }

  /** @param {number|null} bin */
  function handOver(bin) {
    if (!dragResolve) return;
    var resolve = dragResolve;
    dragResolve = null;
    resolve(bin);
  }

  cardEl.addEventListener('pointerdown', function (ev) {
    if (cardLocked || drag) return;
    ev.preventDefault();
    drag = { pointerId: ev.pointerId, startX: ev.clientX, dx: 0 };
    try { cardEl.setPointerCapture(ev.pointerId); } catch (err) { /* capture is a nicety */ }
    cardEl.classList.add('grabbed');
    Arcade.sfx.play('grab');
  });
  cardEl.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    drag.dx = ev.clientX - drag.startX;
    placeCard(drag.dx, false);
  });
  cardEl.addEventListener('pointerup', function (ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    var dx = drag.dx;
    settleDrag(null);
    cardEl.classList.remove('grabbed');
    var limit = tableWidth() * COMMIT;
    if (Math.abs(dx) < limit) { placeCard(0, true); return; }
    commit(dx < 0 ? 0 : 1);
  });
  cardEl.addEventListener('pointercancel', function (ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    settleDrag(null);
    cardEl.classList.remove('grabbed');
    placeCard(0, true);
  });

  /** Fly the card into a bin and hand the answer over. @param {number} bin */
  function commit(bin) {
    if (cardLocked) return;
    cardLocked = true;
    var out = tableWidth() * (bin === 0 ? -1.1 : 1.1);
    placeCard(out, true);
    Arcade.sfx.play('snap');
    handOver(bin);
  }

  /** @param {number} bin the keyboard's road to the same answer */
  function answerKbd(bin) { if (!cardLocked && !drag) commit(bin); }

  /** @param {any} D */
  function buildKbdRow(D) {
    kbdRow.textContent = '';
    [0, 1].forEach(function (bin) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-ghost';
      b.textContent = (bin === 0 ? '← ' : '') + D.bins[bin] + (bin === 1 ? ' →' : '');
      b.setAttribute('aria-label', 'Sort into ' + D.bins[bin]);
      b.addEventListener('click', function () { answerKbd(bin); });
      kbdRow.appendChild(b);
    });
  }

  document.addEventListener('keydown', function (ev) {
    if (!run || screens.play.classList.contains('active') === false) return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); answerKbd(0); }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); answerKbd(1); }
  });

  /* ===== ROUND CHROME ===== */

  /** @param {any} card @param {any} D @param {number} index @param {number} total @param {boolean} lightning */
  function paintCard(card, D, index, total, lightning) {
    cardEmoji.textContent = card.emoji;
    cardText.textContent = card.text;
    deckTag.textContent = lightning ? '⚡ Lightning' : D.name;
    deckTag.classList.toggle('lightning', lightning);
    cardCount.textContent = (index + 1) + ' / ' + total;
    binLeftLabel.textContent = D.bins[0];
    binRightLabel.textContent = D.bins[1];
    binLeft.classList.remove('near', 'good', 'bad');
    binRight.classList.remove('near', 'good', 'bad');
    cardEl.style.transition = 'none';
    cardEl.style.transform = 'translateX(0) rotate(0)';
    cardEl.classList.remove('deal');
    void cardEl.offsetWidth;
    cardEl.classList.add('deal');
    cardRead.textContent = card.text + '. Left: ' + D.bins[0] + '. Right: ' + D.bins[1] + '.';
  }

  /** @param {string} kind @param {string} msg @param {string} why @param {boolean} ack */
  function paintSheet(kind, msg, why, ack) {
    sheetMsg.textContent = msg;
    sheetWhy.textContent = why;
    sheetBtn.style.display = ack ? '' : 'none';
    sheet.className = 'sheet ' + kind + ' open';
  }
  function hideSheet() { sheet.classList.remove('open'); sheetBtn.style.display = 'none'; }

  /** @type {(() => void)|null} */ var ackResolve = null;
  function ackNow() { if (!ackResolve) return; var r = ackResolve; ackResolve = null; r(); }
  sheetBtn.addEventListener('click', function () { hideSheet(); ackNow(); });

  /** @param {string} msg @param {string} why @param {string} [label] @param {string} [kind] @returns {Promise<void>} */
  function sheetAsk(msg, why, label, kind) {
    ackNow();
    sheetBtn.textContent = label || 'Got it';
    paintSheet(kind || 'wrong', msg, why, true);
    return new Promise(function (resolve) { ackResolve = resolve; });
  }

  /** A moment to read, or a tap anywhere to move on. @param {number} ms @returns {Promise<void>} */
  function readBeat(ms) {
    return new Promise(function (resolve) {
      var timer = setTimeout(done, ms);
      function done() { clearTimeout(timer); document.removeEventListener('pointerdown', done); resolve(); }
      document.addEventListener('pointerdown', done);
    });
  }

  /** The card's clock: a bar that waits for the deal to land, then counts down.
   *  @param {number} ms @returns {{next:() => Promise<number|null>, remaining:() => number, pause:() => void, resume:() => void, stop:() => void}} */
  function roundClock(ms) {
    var expired = false;
    /** @type {any} */ var startHandle = null;
    var waitingToStart = false;
    var timer = Arcade.timerBar(timerEl, ms, { warnAt: WARN_MS, onEnd: atZero });
    function atZero() {
      if (expired) return;
      expired = true;
      cardLocked = true;
      settleDrag(null);
      placeCard(0, true);
      handOver(null);
    }
    function armStart() {
      startHandle = setTimeout(function () { startHandle = null; timer.start(); }, CARD_IN_MS);
    }
    function disarmStart() { if (!startHandle) return false; clearTimeout(startHandle); startHandle = null; return true; }
    armStart();
    return {
      next: function () { return expired ? Promise.resolve(null) : nextSort(); },
      remaining: function () { return timer.remaining(); },
      pause: function () { if (disarmStart()) { waitingToStart = true; return; } timer.pause(); },
      resume: function () { if (expired) return; if (waitingToStart) { waitingToStart = false; armStart(); return; } timer.resume(); },
      stop: function () { expired = true; disarmStart(); timer.stop(); handOver(null); }
    };
  }

  function pauseClocks() { if (run && run.clock) run.clock.pause(); if (exam && exam.pause) exam.pause(); }
  function resumeClocks() { if (run && run.clock) run.clock.resume(); if (exam && exam.resume) exam.resume(); }

  function punish() {
    Arcade.shake(table);
    run.hearts.lose();
    run.streak.miss();
  }

  /** @param {number} points */
  function award(points) { run.score += points; scoreEl.textContent = String(run.score); }

  /** @param {number} left @param {number} total @param {number} cap @returns {number} */
  function speedBonus(left, total, cap) {
    var window = total - GRACE_MS;
    var frac = window > 0 ? Math.min(1, Math.max(0, left / window)) : (left > 0 ? 1 : 0);
    var bonus = Math.round(cap * frac);
    run.speedTotal += bonus;
    return bonus;
  }

  /** A hit on the streak, and the call-out when it reaches a new multiplier. */
  function streakUp() {
    run.streak.hit();
    run.bestStreak = Math.max(run.bestStreak, run.streak.count);
    var line = JUICE.streak[run.streak.count];
    if (line) Arcade.toast(line, 1400);
  }

  /** Fisher-Yates on a copy. @param {any[]} list @returns {any[]} */
  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i -= 1) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /** The hand: ROUNDS + LIGHTNING cards, drawn by the tracker's weights so a replay leans toward
   *  the topics the student keeps missing, with both bins represented in the first four.
   *  @param {any} D @returns {any[]} */
  function drawCards(D) {
    var weights = D.pool.map(function (c) { return Arcade.cardWeight(c.ced); });
    var picked = Arcade.weightedSample(D.pool, weights, Math.min(D.pool.length, ROUNDS + LIGHTNING));
    var hand = shuffled(picked);
    // never open on four of the same bin: a student who has not read the bins yet would learn
    // the wrong lesson from a lucky streak
    var first = hand.slice(0, 4);
    if (first.every(function (c) { return c.bin === first[0].bin; })) {
      for (var i = 4; i < hand.length; i += 1) if (hand[i].bin !== first[0].bin) { var t = hand[1]; hand[1] = hand[i]; hand[i] = t; break; }
    }
    return hand;
  }

  /* ===== ROUND LOOP ===== */

  /** @param {any} card @param {any} D @param {number} index @param {number} total @param {boolean} lightning @param {number} token */
  async function playCard(card, D, index, total, lightning, token) {
    paintCard(card, D, index, total, lightning);
    hintEl.textContent = lightning ? 'Fast: drag it home' : 'Drag the card into a bin';
    Arcade.sfx.play('card');
    if (Arcade.voice.enabled) Arcade.say(card.text, { who: 'anchor' });
    cardLocked = false;
    var ms = lightning ? LIGHTNING_MS : CARD_MS;
    run.clock = roundClock(ms);
    var ans = await run.clock.next();
    if (!alive(token)) return;
    var left = run.clock.remaining();
    run.clock.stop();
    cardLocked = true;

    var ok = ans === card.bin;
    run.asked += 1;
    Arcade.track(card.ced, card.skill, ok);
    var truth = D.bins[card.bin];
    if (ok) {
      (card.bin === 0 ? binLeft : binRight).classList.add('good');
      Arcade.sfx.play('correct');
      award(Math.round(((lightning ? 150 : 100) + speedBonus(left, ms, 50)) * run.streak.mult));
      streakUp();
      run.correct += 1;
      paintSheet('correct', '✓ ' + truth, card.why, false);
      await readBeat(WHY_MS);
    } else {
      if (ans !== null) (ans === 0 ? binLeft : binRight).classList.add('bad');
      (card.bin === 0 ? binLeft : binRight).classList.add('good');
      Arcade.sfx.play('wrong');
      punish();
      run.missed.push(card);
      await sheetAsk(ans === null ? '✗ Out of time — ' + truth : '✗ ' + truth, card.why);
    }
    if (!alive(token)) return;
    hideSheet();
  }

  /* ===== EXAM SPRINT ===== */

  /** @param {any} q @param {number} index @param {number} total @param {number} token @returns {Promise<boolean>} */
  async function askQuestion(q, index, total, token) {
    examCountEl.textContent = (index + 1) + '/' + total;
    examStemEl.textContent = q.stem;
    examChoicesEl.textContent = '';
    var buttons = q.choices.map(function (text, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-ghost btn-block choice';
      b.textContent = KEYS.charAt(i) + '. ' + text;
      examChoicesEl.appendChild(b);
      return b;
    });
    var picked = await new Promise(function (resolve) {
      var settled = false;
      var timer = Arcade.timerBar(examTimerEl, EXAM_MS, { warnAt: WARN_MS, onEnd: function () { finish(-1); } });
      function finish(i) { if (settled) return; settled = true; timer.stop(); resolve(i); }
      buttons.forEach(function (b, i) { b.addEventListener('click', function () { finish(i); }); });
      exam.stop = function () { finish(-1); };
      exam.pause = function () { timer.pause(); };
      exam.resume = function () { if (!settled) timer.resume(); };
      timer.start();
    });
    if (!examAlive(token)) return false;
    var ok = picked === q.answer;
    buttons.forEach(function (b, i) { b.classList.add('marked'); if (i === q.answer) b.classList.add('right'); else if (i === picked) b.classList.add('wrong'); });
    Arcade.sfx.play(ok ? 'correct' : 'wrong');
    Arcade.track(q.ced, q.skill, ok);
    await sheetAsk(ok ? '✓ Correct' : '✗ ' + KEYS.charAt(q.answer) + ' is the answer', q.why, 'Next', ok ? 'correct' : 'wrong');
    if (!examAlive(token)) return ok;
    hideSheet();
    return ok;
  }

  /** @param {number} n */
  function startExam(n) {
    var D = deckOf(n);
    if (!D || !D.exam || !D.exam.length) return;
    abortRun();
    show('exam');
    runExam(D).catch(function () { Arcade.toast('Something went wrong — back to the decks'); goSelect(); });
  }

  /** @param {any} D */
  async function runExam(D) {
    examToken += 1;
    var token = examToken;
    exam = { D: D, stop: null };
    examSubEl.textContent = 'Deck ' + D.n + ' · ' + D.name;
    hideSheet();
    var right = 0;
    var items = Arcade.shuffledExam(D.exam).slice(0, EXAM_DRAW);   // three of the pool, in a fresh order with fresh letters
    for (var i = 0; i < items.length; i += 1) {
      var ok = await askQuestion(items[i], i, items.length, token);
      if (!examAlive(token)) return;
      if (ok) right += 1;
    }
    examToken += 1;
    showExamResult(D, right, items.length);
  }

  /** @param {any} D @param {number} right @param {number} total */
  function showExamResult(D, right, total) {
    var rec = saveExam(D.n, right, total);
    sheetBtn.textContent = 'Got it';
    show('end');
    Arcade.endScreen(screens.end, {
      title: 'EXAM SPRINT', sub: 'Exam Sprint: ' + right + '/' + total,
      score: rec.best || 0, accuracy: rec.acc || 0,
      medal: rec.medal, stamp: Arcade.stampFor(rec.acc || 0),
      ribbon: rec.examPerfect ? 'Exam Ready' : '',
      stats: [{ label: 'Deck ' + D.n, value: D.name }, { label: 'Best sprint', value: rec.exam.right + '/' + rec.exam.total }],
      note: rec.medal === 'gold' ? '' : 'Gold needs 95% on the deck and 2 of 3 here.',
      buttons: [
        { label: 'Decks', primary: true, onClick: goSelect },
        { label: 'Run it again', onClick: function () { startExam(D.n); } },
        ARCADE_BUTTON
      ]
    });
    Arcade.focusScreen(screens.end);
    if (right === total) Arcade.confetti();
  }

  /* ===== THE RUN ===== */

  /** @param {number} n */
  function startDeck(n) {
    var D = deckOf(n);
    if (!D) return;
    abortRun();
    if (!howtoSeen(n)) { openHowto(n, function () { markHowtoSeen(n); beginDeck(D); }, goSelect); return; }
    beginDeck(D);
  }

  /** @param {any} D */
  function beginDeck(D) {
    show('play');
    playDeck(D).catch(function () { Arcade.toast('Something went wrong — back to the decks'); goSelect(); });
  }

  /** @param {any} D */
  async function playDeck(D) {
    runToken += 1;
    var token = runToken;
    run = { D: D, hearts: Arcade.hearts(heartsEl, HEARTS), streak: Arcade.streak(), score: 0, asked: 0, correct: 0, bestStreak: 0, speedTotal: 0, clock: null, missed: [] };
    run.streak.render(comboEl);
    scoreEl.textContent = '0';
    hideSheet();
    buildKbdRow(D);
    var hand = drawCards(D);
    var total = hand.length;
    for (var i = 0; i < hand.length; i += 1) {
      var lightning = i >= hand.length - LIGHTNING;
      if (lightning && i === hand.length - LIGHTNING) { Arcade.sfx.play('boss'); Arcade.slam(JUICE.lightning); await wait(700); if (!alive(token)) return; }
      await playCard(hand[i], D, i, total, lightning, token);
      if (!alive(token)) return;
      if (run.hearts.get() === 0) { showFail(D); return; }
    }
    showClear(D);
  }

  /* ===== END SCREENS ===== */

  function goHome() { window.location.href = '../index.html'; }
  var ARCADE_BUTTON = { label: 'Arcade', onClick: goHome };

  /** @returns {number} */
  function accuracy() { return run.asked ? run.correct / run.asked : 0; }

  /** @param {any} panel */
  function showMissed(panel) {
    if (!panel || !run.missed.length) return;
    var list = fill('missed-list', '');
    list.appendChild(chip('muted', 'Missed: '));
    run.missed.forEach(function (card, i) { list.appendChild(chip('missed-head', (i ? ' · ' : '') + card.text)); });
    panel.insertBefore(list, panel.lastElementChild);
  }

  /** @param {any} panel @param {any} before */
  function showTitle(panel, before) {
    if (!panel) return;
    var after = Arcade.titleFor();
    var rose = after.rank > before.rank;
    var line = fill('title-chip' + (rose ? ' up' : ''), 'Title: ' + after.name + (rose ? ' · 🎉 New title!' : ''));
    var head = panel.querySelector('.end-head');
    head.parentNode.insertBefore(line, head.nextSibling);
    if (rose) Arcade.sfx.play('coin');
  }

  /** @param {any} D */
  function showClear(D) {
    var acc = accuracy();
    var score = run.score;
    runToken += 1;
    Arcade.voice.stop();
    sheetBtn.textContent = 'Got it';
    var beforeTitle = Arcade.titleFor();
    saveProgress(D.n, score, acc);
    Arcade.saveBest('sort', { score: score, initials: Arcade.initials(), level: D.n });
    var saved = loadProgress();
    var rec = saved.levels[String(D.n)] || {};
    show('end');
    var panel = Arcade.endScreen(screens.end, {
      title: 'DECK CLEARED', sub: 'Deck ' + D.n + ' · ' + D.name,
      score: score, accuracy: acc, stamp: Arcade.stampFor(acc),
      medal: Arcade.medalFor(acc, { examPassed: !!(rec.exam && rec.exam.right >= 2) }),
      stats: [{ label: 'Best streak', value: String(run.bestStreak) }, { label: 'Speed bonus', value: '+' + run.speedTotal }],
      note: EXAM_FRAME + (saved.unlocked > D.n ? '' : ' · Clear 75% to unlock the next deck.'),
      buttons: [
        { label: 'Exam Sprint →', primary: true, variant: 'gold', onClick: function () { startExam(D.n); } },
        { label: 'Decks', onClick: goSelect },
        { label: 'Replay', onClick: function () { startDeck(D.n); } },
        ARCADE_BUTTON
      ]
    });
    showTitle(panel, beforeTitle);
    showMissed(panel);
    Arcade.focusScreen(screens.end);
    Arcade.confetti();
  }

  /** @param {any} D */
  function showFail(D) {
    var acc = accuracy();
    runToken += 1;
    Arcade.voice.stop();
    sheetBtn.textContent = 'Got it';
    show('end');
    var panel = Arcade.endScreen(screens.end, {
      title: 'DECK FAILED', sub: 'Three wrong sorts. Retry?', tone: 'fail',
      score: run.score, accuracy: acc, medal: null, stamp: Arcade.stampFor(acc),
      stats: [{ label: 'Best streak', value: String(run.bestStreak) }, { label: 'Right', value: run.correct + '/' + run.asked }],
      buttons: [
        { label: 'Retry', primary: true, onClick: function () { startDeck(D.n); } },
        { label: 'Decks', onClick: goSelect },
        ARCADE_BUTTON
      ]
    });
    showMissed(panel);
    Arcade.focusScreen(screens.end);
  }

  function goSelect() {
    abortRun();
    sheetBtn.textContent = 'Got it';
    paintSelect();
    show('select');
  }

  /* ===== HOW TO PLAY ===== */

  /** @type {(() => void)|null} */ var howtoAfter = null;
  /** @type {(() => void)|null} */ var howtoBackTo = null;

  /** @param {number} n @returns {boolean} */
  function howtoSeen(n) {
    var saved = Arcade.store.get('arcade.sort.howto', null);
    var seen = saved && Array.isArray(saved.seen) ? saved.seen : [];
    return seen.indexOf(n) >= 0;
  }
  /** @param {number} n */
  function markHowtoSeen(n) {
    var saved = Arcade.store.get('arcade.sort.howto', null);
    var seen = saved && Array.isArray(saved.seen) ? saved.seen.filter(function (v) { return typeof v === 'number'; }) : [];
    if (seen.indexOf(n) < 0) seen.push(n);
    Arcade.store.set('arcade.sort.howto', { seen: seen });
  }

  /** @param {number} n */
  function paintHowto(n) {
    var D = deckOf(n);
    howtoTitle.textContent = D ? 'How to play · ' + D.name : 'How to play';
    howtoCards.textContent = '';
    var cards = HOWTO.slice();
    if (D) cards.unshift({ emoji: '\u{1F5C2}️', head: D.bins[0] + ' ← or → ' + D.bins[1], body: D.blurb + '. Left is ' + D.bins[0] + ', right is ' + D.bins[1] + '.' });
    cards.forEach(function (card) {
      var panel = fill('panel howto-card', '');
      var emoji = fill('howto-emoji', card.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      panel.appendChild(emoji);
      var body = fill('', '');
      body.appendChild(fill('howto-head', card.head));
      body.appendChild(fill('howto-body', card.body));
      panel.appendChild(body);
      howtoCards.appendChild(panel);
    });
  }

  /** @param {number} n @param {() => void} after @param {() => void} [back] */
  function openHowto(n, after, back) { howtoAfter = after; howtoBackTo = back || after; paintHowto(n); show('howto'); }
  /** @param {boolean} [backwards] */
  function closeHowto(backwards) { var go = backwards === true ? howtoBackTo : howtoAfter; howtoAfter = null; howtoBackTo = null; if (go) go(); }

  function paintIntro() {
    introEl.textContent = '';
    var title = fill('intro-title', 'What is this game?');
    title.id = 'introTitle';
    introEl.appendChild(title);
    INTRO.forEach(function (line) {
      var row = fill('intro-line', '');
      var emoji = fill('intro-emoji', line.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      row.appendChild(emoji);
      row.appendChild(fill('intro-text', line.text));
      introEl.appendChild(row);
    });
  }

  /* ===== BOOT ===== */

  Arcade.bigType(Arcade.store.get('arcade.bigType', false));
  Arcade.sfx.bindMuteButton(byId('muteBtn'));
  Arcade.voice.bindButton(byId('voiceBtn'));
  if (Arcade.mountSwitcher) Arcade.mountSwitcher({ current: 'sort' });   // absent only on an engine a cache held back
  sheetBtn.style.display = 'none';
  paintIntro();

  initialsBtn.textContent = Arcade.initials();
  initialsBtn.addEventListener('click', function () {
    if (!initialsPanel.hidden) { initialsPanel.hidden = true; return; }
    initialsPanel.hidden = false;
    Arcade.initialsEntry(initialsMount, { onDone: function (value) { initialsBtn.textContent = value; initialsPanel.hidden = true; } });
  });

  byId('examPace').textContent = TIMING.examSeconds + ' s';
  byId('playBtn').addEventListener('click', goSelect);
  byId('selectBack').addEventListener('click', function () { abortRun(); show('title'); });
  byId('playBack').addEventListener('click', goSelect);
  byId('examBack').addEventListener('click', goSelect);
  byId('howtoBack').addEventListener('click', function () { closeHowto(true); });
  byId('howtoGo').addEventListener('click', function () { closeHowto(false); });
  byId('selectHowto').addEventListener('click', function () { openHowto(0, function () { show('select'); }); });
  byId('playHowto').addEventListener('click', function () {
    if (!run) return;
    pauseClocks();
    openHowto(run.D.n, function () { show('play'); resumeClocks(); });
  });

  paintSelect();
  var deepLink = parseInt(String(Arcade.qs('level', '')), 10);
  if (Number.isFinite(deepLink)) {
    if (playable(deepLink)) startDeck(deepLink);
    else { show('select'); Arcade.toast(deckOf(deepLink) ? 'Deck ' + deepLink + ' is still locked' : 'No deck ' + deepLink); }
  }
  booted = true;
}());
</script>

</body>
